/* Sıralı onay zinciri: step_order'a göre sıralanmış listede, ilk kararı
   verilmemiş (decision NULL) satır "aktif" adımdır — ondan önceki tüm
   adımlar APPROVED olmadıkça bir sonraki adım görünmez/kararlaştırılamaz.
   Zincirde bir REJECTED/RETURNED varsa (checkApprovalAuto zaten MOC'u
   APPROVAL dışına çıkarır) burada aktif adım yoktur (null döner). */
function activeApprovalStep(approvals){
  var list=(approvals||[]).slice().sort(function(a,b){return a.step_order-b.step_order;});
  for(var i=0;i<list.length;i++){
    if(!list[i].decision) return list[i];
    if(list[i].decision!=='APPROVED') return null;
  }
  return null;
}
function renderApprovalsPanel(){
  var ctx=DETAIL_CTX, req=ctx.req;
  var active=activeApprovalStep(ctx.approvals);
  var html='<div class="panel"><div class="ph"><h2>'+t('Onay Zinciri')+'</h2>';
  /* APPROVAL da dahil: onay adımsız kilitlenmiş eski kayıtların kurtarma yolu (bkz. condReadyForApproval). */
  if(canDo('coordinate') && (req.status==='TECHNICAL_REVIEW' || req.status==='APPROVAL')) html+='<button class="btn-line sm" id="btnAddApproval" style="margin-left:auto">'+t('+ Onay Adımı Ekle')+'</button>';
  html+='</div><div class="pb">';
  if(!ctx.approvals.length){ html+='<div class="empty">'+t('Onay adımı tanımlanmadı.')+'</div>'; }
  else{
    html+='<p class="hint" style="margin-bottom:10px">'+t('Onay zinciri sıralıdır — bir adım, kendinden önceki tüm adımlar onaylanmadan kararlaştırılamaz.')+'</p>';
    html+=ctx.approvals.slice().sort(function(a,b){return a.step_order-b.step_order;}).map(function(a){
      var can = canDecideApproval(a);
      var decLbl;
      if(a.decision){
        decLbl = '<span class="pill '+(a.decision==='APPROVED'?'ok':a.decision==='REJECTED'?'crit':'warn')+'">'+a.decision+'</span> · '+fmtDT(a.decided_at);
      } else if(active && active.id===a.id){
        decLbl = '<span class="pill warn">'+t('Bekliyor (sıradaki adım)')+'</span>';
      } else {
        decLbl = '<span class="pill miss">'+t('Kilitli — önceki adım(lar) tamamlanmadı')+'</span>';
      }
      var actions='';
      if(can){
        actions='<button class="sm btn-leaf apdec" data-id="'+a.id+'" data-dec="APPROVED">'+t('Onayla')+'</button>'
          +'<button class="sm btn-line apdec" data-id="'+a.id+'" data-dec="RETURNED">'+t('İade')+'</button>'
          +'<button class="sm btn-crit apdec" data-id="'+a.id+'" data-dec="REJECTED">'+t('Reddet')+'</button>';
      }
      return '<div class="approval-row"><div class="step-badge'+(a.decision==='APPROVED'?' done':'')+'">'+a.step_order+'</div>'
        +'<div style="flex:1"><b>'+esc(a.role_code)+'</b><div class="hint">'+decLbl+'</div></div>'
        +'<div style="display:flex;gap:6px">'+actions+'</div></div>';
    }).join('');
  }
  html+='</div></div>';
  return html;
}
function canDecideApproval(a){
  var ctx=DETAIL_CTX, req=ctx.req;
  if(a.decision) return false;
  if(!canDo('approve') && cloudRole==='VIEWER') return false; // taban izin onay veremez
  if(req.initiator_id===cloudUserId) return false; // çıkar çatışması
  if(a.approver_id && a.approver_id!==cloudUserId) return false; // atanmışsa yalnız o kişi
  var active=activeApprovalStep(ctx.approvals);
  if(!active || active.id!==a.id) return false; // sıralı zincir: yalnız aktif (sıradaki) adım kararlaştırılabilir
  return true;
}

/* ---- Durum geçişi ---- */
function doTransition(to){
  var req=DETAIL_CTX.req;
  var opt=(TRANSITIONS[req.status]||[]).find(function(t){return t.to===to;});
  if(!opt || !canDo(opt.action)){ toast('Bu geçiş için yetkiniz yok.',true); return; }
  if(opt.cond && !opt.cond(req,DETAIL_CTX)){ toast('Geçiş koşulu sağlanmadı.',true); return; }
  var patch={status:to};
  if(to==='REJECTED'){
    var reason=val('rejectReason');
    if(!reason.trim()){ toast('Red gerekçesi zorunlu.',true); return; }
    patch.reason=reason;
  }
  if(to==='CLOSED') patch.closed_at=new Date().toISOString();
  var pre = (to==='APPROVAL' && req.status==='TECHNICAL_REVIEW') ? ensureRiskThresholdApproval() : Promise.resolve();
  pre.then(function(){
    sb.from('moc_requests').update(patch).eq('id',req.id).then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      /* Geçişin kendisinden SONRA çalışması gereken temizlik (bkz. resetPssrResult).
         Hata verirse kullanıcıya bildirilir ama durum geçişi geri alınmaz — geçiş zaten
         yazıldı; burada sessiz kalmak, PSSR kilidinin geri gelmesi demek olurdu. */
      var son = opt.after ? opt.after() : Promise.resolve();
      son.catch(function(e){ toast(hataMesaji(e),true); }).then(function(){
        toast(t('Durum güncellendi')+': '+t(STATUS_LABEL[to]));
        viewDetail(req.id);
      });
    });
  });
}
/* Risk eşiğine göre otomatik ek onay adımı (bkz. Ayarlar > Akış Türleri).
   moc_types.extra_approval_risk_threshold/role_code aşılırsa ve o role_code
   için henüz bir onay adımı yoksa, sona bir tane eklenir. */
function ensureRiskThresholdApproval(){
  var ctx=DETAIL_CTX, t=ctx.type;
  if(!t || !t.extra_approval_risk_threshold || !t.extra_approval_role_code) return Promise.resolve();
  var maxRisk = (ctx.risks||[]).reduce(function(m,r){ return Math.max(m, r.risk_after||0); }, 0);
  if(maxRisk < t.extra_approval_risk_threshold) return Promise.resolve();
  var already = (ctx.approvals||[]).some(function(a){ return a.role_code===t.extra_approval_role_code; });
  if(already) return Promise.resolve();
  var nextStep=(ctx.approvals||[]).length+1;
  return sb.from('moc_approvals').insert({tenant_id:cloudTenantId, moc_id:ctx.req.id, step_order:nextStep, role_code:t.extra_approval_role_code}).then(function(res){
    if(!res.error) toast('Risk eşiği aşıldı — otomatik ek onay adımı eklendi: '+t.extra_approval_role_code);
  });
}

/* DÜZELTME (2026-09-17, FAZ N — GÖREV 2+3): Karar + zincir kontrolü + moc_requests.status
   güncellemesi eskiden 3 bağımsız istekti (update + select + Promise.all + update), ve
   evidence_hash istemcide düz btoa() ile üretiliyordu (kriptografik değil). Artık tek bir
   SECURITY DEFINER RPC'de (moc_decide_approval, moc_schema_faz_n_guvenlik_sertlestirme.sql)
   — sunucuda gerçek SHA-256 hesaplanır, karar+zincir+status tek transaction'da yazılır.
   moc_onay_kontrol/moc_durum_kontrol trigger'ları (kendi-onayı/mükerrer-onay engeli) RPC
   içindeki UPDATE'lerde aynen tetiklenmeye devam eder — dokunulmadı. */
function decideApproval(id, decision){
  confirmBox('Bu onay adımı için karar: <b>'+decision+'</b>. Onaylıyor musunuz?','Onayla',function(){
    sb.rpc('moc_decide_approval', {p_approval_id:id, p_decision:decision}).then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      closeModal(); toast(t('Karar kaydedildi')); viewDetail(DETAIL_CTX.req.id);
    });
  }, decision==='REJECTED');
}

/* ---- PSSR ---- */
var pssrOlusturuluyor=false;
function createPssr(){
  /* Çift tıklama koruması: eskiden düğme korumasızdı, iki tık iki checklist açıyor ve
     paneli kalıcı olarak işlevsizleştiriyordu (KALICI KİLİT 3). Kesin engel veritabanındaki
     UNIQUE(moc_id) kısıtı (moc_schema_faz_h), buradaki bayrak yalnız ilk savunma. */
  if(pssrOlusturuluyor || (DETAIL_CTX.pssr && DETAIL_CTX.pssr.id)) return;
  pssrOlusturuluyor=true;
  var btn=document.getElementById('btnCreatePssr'); if(btn) btn.disabled=true;
  sb.from('moc_pssr_checklists').insert({tenant_id:cloudTenantId, moc_id:DETAIL_CTX.req.id, is_template:false, name:'PSSR — '+DETAIL_CTX.req.title, items:[]}).then(function(res){
    pssrOlusturuluyor=false;
    if(res.error){ if(btn) btn.disabled=false; toast(hataMesaji(res.error),true); return; }
    toast(t('Checklist oluşturuldu')); viewDetail(DETAIL_CTX.req.id);
  });
}
/* DÜZELTME (2026-09-05) — KALICI KİLİT 2: PSSR "serbest bırakılmadı" sonucu verilip kayıt
   IMPLEMENTATION'a döndüğünde `result` alanı 'NOT_RELEASED' olarak KALIYORDU. Karar düğmeleri
   yalnız `!p.result` iken çizildiği için, eksikler giderilip tekrar PSSR'a gelindiğinde düğmeler
   bir daha görünmüyor, PSSR→STARTUP koşulu ('RELEASED') asla sağlanamıyor ve talep PSSR'da
   kalıcı olarak kilitleniyordu. Durum makinesi dosyası bu döngüyü (PSSR→IMPLEMENTATION→…→PSSR)
   açıkça öngörüyor; kod tek seferlik varsaymış. Artık geri dönüşte sonuç sıfırlanır. */
function resetPssrResult(){
  var p = DETAIL_CTX && DETAIL_CTX.pssr;
  if(!p || !p.id) return Promise.resolve();
  return sb.from('moc_pssr_checklists')
    .update({result:null, performed_by:null, performed_at:null}).eq('id',p.id)
    .then(function(res){ if(res.error) throw res.error; });
}
function setPssrResult(result){
  sb.from('moc_pssr_checklists').update({result:result, performed_by:cloudUserId, performed_at:new Date().toISOString()}).eq('id',DETAIL_CTX.pssr.id).then(function(res){
    if(res.error){ toast(hataMesaji(res.error),true); return; }
    toast(t('PSSR sonucu kaydedildi')); viewDetail(DETAIL_CTX.req.id);
  });
}

function fillRequestForm(req){
  if(req){
    document.getElementById('fTitle').value=req.title||'';
    document.getElementById('fDesc').value=req.description||'';
    document.getElementById('fCat').value=req.category_id||'';
    document.getElementById('fType').value=req.type_id||'';
    document.getElementById('fUnit').value=req.unit_area||'';
    document.getElementById('fPrio').value=req.priority||'NORMAL';
    document.getElementById('fEnd').value=req.planned_end||'';
    document.getElementById('fRik').checked=!!req.is_rik;
    document.getElementById('fReason').value=req.reason||'';
    document.getElementById('fCurrency').value=req.para_birimi||'TRY';
    document.getElementById('fCostStart').value=req.baslangic_maliyeti!=null?req.baslangic_maliyeti:'';
  }
  toggleEndDate();
  document.getElementById('fType').onchange=toggleEndDate;
}
function toggleEndDate(){
  var t=typeById(Number(val('fType')));
  document.getElementById('fEndDateWrap').style.display = (t&&t.requires_end_date)?'':'none';
}
function readRequestForm(){
  var t=typeById(Number(val('fType')));
  var title=val('fTitle');
  if(!title.trim()){ toast('Başlık zorunlu.',true); var _ft=document.getElementById('fTitle'); if(_ft){ _ft.style.borderColor='var(--crit)'; _ft.focus(); } return null; }
  if(t&&t.requires_end_date&&!val('fEnd')){ toast('Bu akış türünde planlanan bitiş tarihi zorunlu.',true); return null; }
  return {
    title:title, description:val('fDesc'), category_id:Number(val('fCat')), type_id:Number(val('fType')),
    unit_area:val('fUnit'), priority:val('fPrio'), planned_end: val('fEnd')||null,
    is_rik: document.getElementById('fRik').checked, reason: val('fReason'),
    para_birimi: val('fCurrency')||'TRY', baslangic_maliyeti: num('fCostStart')
  };
}
function openNewRequest(){
  modalTitle('Yeni Değişiklik Talebi');
  setModalBody(requestFormHtml());
  fillRequestForm(null);
  modalFoot('Oluştur (Taslak)','Vazgeç',function(){
    var payload=readRequestForm();
    if(!payload) return;
    payload.tenant_id=cloudTenantId; payload.initiator_id=cloudUserId; payload.status='DRAFT';
    sb.from('moc_requests').insert(payload).select().single().then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      var req=res.data;
      var typ=typeById(req.type_id);
      var after=Promise.resolve();
      if(typ&&typ.requires_end_date&&req.planned_end){
        after=sb.from('moc_temporary_tracking').insert({tenant_id:cloudTenantId, moc_id:req.id, expires_at:req.planned_end});
      }
      Promise.resolve(after).then(function(){
        closeModal(); toast(t('Talep oluşturuldu')); go('detail', req.id);
      });
    });
  });
  openModal();
}

function cloneChecklistSet(setId){
  var s=(ALL_CHECKLIST_SETS||[]).find(function(x){return x.id===setId;});
  if(!s) return;
  sb.from('moc_etki_checklist_setleri').insert({tenant_id:cloudTenantId, kategori_id:s.kategori_id, ad:s.ad, aciklama:s.aciklama, aktif:true}).select().single().then(function(res){
    if(res.error){ toast(hataMesaji(res.error),true); return; }
    var newSetId=res.data.id;
    var items=(ALL_CHECKLIST_ITEMS||[]).filter(function(m){return m.set_id===setId;});
    if(!items.length){ toast(t('Set kopyalandı')); viewSettings(); return; }
    var payload=items.map(function(m){
      return {set_id:newSetId, bolum_baslik:m.bolum_baslik, soru_metni:m.soru_metni, sira_no:m.sira_no, evet_aksiyon_gerekli:m.evet_aksiyon_gerekli, tetikleyen_cevap:m.tetikleyen_cevap||'Evet'};
    });
    sb.from('moc_etki_checklist_maddeleri').insert(payload).then(function(res2){
      if(res2.error){ toast(hataMesaji(res2.error),true); return; }
      toast(t('Set tesisinize kopyalandı')); viewSettings();
    });
  });
}

function modalTitle(ttl){ document.getElementById('modalTitle').textContent=t(ttl); }

function modalFoot(saveLbl,cancelLbl,onSave){
  var sv=document.getElementById('modalSave'), cn=document.getElementById('modalCancel');
  sv.className='btn-leaf';
  /* DÜZELTME (2026-09-05): Kaydet tıklandıktan sonra devre dışı bırakılmıyordu; yavaş
     bağlantıda iki tık iki ayrı kayıt (iki ayrı MOC numarası, iki aksiyon, iki onay adımı)
     üretiyordu. Düğme artık ilk tıklamada kilitlenir; işlem hata verirse çağıran taraf
     modalı açık bıraktığında düğme yeniden açılsın diye kısa bir süre sonra serbest kalır. */
  if(saveLbl){
    sv.style.display=''; sv.textContent=t(saveLbl); sv.disabled=false;
    sv.onclick = onSave ? function(ev){
      if(sv.disabled) return;
      sv.disabled=true;
      try{ onSave(ev); } finally { setTimeout(function(){ sv.disabled=false; }, 2500); }
    } : null;
  } else sv.style.display='none';
  cn.textContent=t(cancelLbl||'Kapat');
}

async function sorunBildirGonder(){
  var btn=document.getElementById('modalSave');
  var msgEl=document.getElementById('sbMsg');
  var aciklama=(document.getElementById('sbAciklama').value||'').trim();
  if(!aciklama){ msgEl.textContent=t('Lütfen kısaca açıklayın.'); msgEl.style.color='var(--crit)'; btn.disabled=false; return; }
  var eski=btn.textContent; btn.textContent=t('Gönderiliyor…');
  msgEl.textContent=''; msgEl.style.color='';
  var surum=null;
  try{ surum=window.__qdlSurumOnbellek||null; }catch(e){}
  try{
    if(!surum){ var r=await fetch('/qdl-version.json',{cache:'no-store'}); if(r.ok){ var j=await r.json(); surum=j&&j.surum; window.__qdlSurumOnbellek=surum; } }
  }catch(e){}
  try{
    var res=await sb.rpc('qdl_musteri_bildirim_gonder',{
      p_modul:MOC_MODUL, p_aciklama:aciklama,
      p_sayfa:(location.pathname||'')+(location.hash||''),
      p_surum:surum||null, p_ua:navigator.userAgent||null
    });
    if(res.error) throw res.error;
    msgEl.style.color='var(--leaf-d)'; msgEl.textContent=t('Teşekkürler, bildiriminiz ekibimize ulaştı. İncelenecek.');
    setTimeout(closeModal,1600);
  }catch(e){
    msgEl.style.color='var(--crit)'; msgEl.textContent=t('Şu anda gönderilemedi. Lütfen birazdan tekrar deneyin.');
    btn.textContent=eski;
  }
}

/* ── Merkezî hata mesajı çevirici (2026-09-05) ──
   NEDEN: 32 noktada ham veritabanı hatası doğrudan ekrana basılıyordu; kullanıcı
   `duplicate key value violates unique constraint "moc_approvals_moc_id_step_order_role_code_key"`
   gibi bir metin görüyor, tablo/kolon/kısıt adları sızıyordu. Bu hem platformun
   "kullanıcı mesajlarında iç detay görünmez" kuralının ihlali hem de şema keşfine
   yardım ettiği için güvenlik açısından istenmeyen bir durumdu. Ham metin artık
   YALNIZ konsola gider. */
function hataMesaji(err){
  try{ console.error('[qdl/moc]', err); }catch(_){}
  var kod=(err&&err.code)||'';
  var msj=String((err&&err.message)||'');

  if(kod==='23505'){
    if(msj.indexOf('step_order')>=0) return t('Bu sıra ve rol için zaten bir onay adımı tanımlı.');
    if(msj.indexOf('moc_no')>=0)     return t('Bu talep numarası zaten kullanılıyor. Lütfen tekrar deneyin.');
    if(msj.indexOf('pssr')>=0)       return t('Bu talep için zaten bir güvenlik incelemesi checklist’i var.');
    if(msj.indexOf('madde')>=0)      return t('Bu madde için zaten bir cevap kayıtlı.');
    return t('Bu kayıt zaten mevcut. Lütfen bilgileri kontrol edin.');
  }
  if(kod==='23503') return t('Bu kayıt başka bir kayda bağlı olduğu için işlem yapılamadı.');
  if(kod==='23514') return t('Girilen değerlerden biri geçerli değil. Lütfen kontrol edin.');
  if(kod==='23502') return t('Zorunlu alanlardan biri boş bırakılmış.');
  if(kod==='42501' || kod==='PGRST301') return t('Bu işlem için yetkiniz yok.');
  if(kod==='PGRST303') return t('Oturumunuzun süresi doldu. Lütfen tekrar giriş yapın.');
  if(kod==='PGRST116') return t('Beklenenden fazla kayıt bulundu. Lütfen sayfayı yenileyin.');

  if(/row-level security|violates row-level/i.test(msj)) return t('Bu işlem için yetkiniz yok.');
  if(/JWT|token is expired/i.test(msj)) return t('Oturumunuzun süresi doldu. Lütfen tekrar giriş yapın.');
  if(/Failed to fetch|NetworkError/i.test(msj)) return t('Bağlantı kurulamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.');

  /* Sunucu tarafı iş kuralı sinyalleri (bkz. moc_schema_faz_h_kurallar.sql) */
  if(msj.indexOf('MOC_YETKI_YOK')>=0)       return t('Bu işlem için yetkiniz yok.');
  if(msj.indexOf('MOC_KENDI_ONAYI')>=0)     return t('Kendi açtığınız talebi onaylayamazsınız.');
  if(msj.indexOf('MOC_MUKERRER_ONAY')>=0)   return t('Bu zincirde daha önce karar verdiniz; ikinci bir adımı siz onaylayamazsınız.');
  if(msj.indexOf('MOC_GECERSIZ_GECIS')>=0)  return t('Bu durum geçişi yapılamaz.');
  if(msj.indexOf('MOC_GOREV_YETKI_YOK')>=0) return pT('Yalnız proje sorumlusu veya atanan görev sahibi işlem yapabilir.');
  if(msj.indexOf('MOC_KONTROL_LISTESI_EKSIK')>=0) return pT('Önce görev kontrol listesini tamamlayın.');
  if(msj.indexOf('MOC_GOREV_KANITI_EKSIK')>=0) return pT('Bu görev için kanıt dosyası yükleyin.');
  if(msj.indexOf('MOC_ZORUNLU_GOREV_ACIK')>=0) return pT('Zorunlu proje görevleri tamamlanmadan kapanış yapılamaz.');
  if(msj.indexOf('MOC_KILOMETRE_TASI_EKSIK')>=0) return pT('Gerekli kilometre taşlarını tamamlayın.');
  if(msj.indexOf('MOC_KAPALI_PROJE_DEGISTIRILEMEZ')>=0) return pT('Kapalı MOC projesi değiştirilemez.');
  /* Sunucu tarafı iş kuralı sinyalleri (bkz. moc_schema_faz_n_guvenlik_sertlestirme.sql) */
  if(msj.indexOf('MOC_PSSR_KILITLI')>=0)    return t('PSSR sonucu zaten kayıtlı, değiştirilemez. Düzeltme gerekiyorsa yönetici PSSR\'ı yeniden açmalı.');
  if(msj.indexOf('MOC_GEREKCE_ZORUNLU')>=0) return t('Gerekçe en az 5 karakter olmalı.');
  if(msj.indexOf('MOC_ZATEN_ACIK')>=0)      return t('Bu PSSR zaten sonuçlanmamış.');
  if(msj.indexOf('MOC_ZATEN_KARARLI')>=0)   return t('Bu adım için zaten karar verilmiş. Sayfa yenileniyor…');
  if(msj.indexOf('MOC_GECERSIZ_KARAR')>=0)  return t('Geçersiz karar değeri.');

  return t('İşlem tamamlanamadı. Lütfen tekrar deneyin.');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
/* Boş-durum (empty state) — satışa hazırlık denetimi bulgusu (16.09.2026): liste boşken
   sade "Kayıt yok." yerine ikon+başlık+açıklama(+CTA) gösterir. Tekrar kullanılabilir,
   modülün mevcut renk/tipografi diline (panel/.empty/.btn-leaf) uyumlu. ctaId verilirse
   düğme render edilir; onclick binding çağıran kod tarafında (id ile) yapılır — data
   çekme mantığına dokunmaz, yalnız görünümdür. */
function renderEmptyState(iconSvg, title, desc, ctaLabel, ctaId){
  var icon = iconSvg || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-6 4h6M9 9h1M5 21h14a2 2 0 0 0 2-2V7.5L15.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z"/></svg>';
  var html='<div class="empty-state">'+icon+'<div class="es-title">'+esc(title)+'</div>';
  if(desc) html+='<div class="es-desc">'+esc(desc)+'</div>';
  if(ctaLabel && ctaId) html+='<button type="button" class="btn-leaf sm es-cta" id="'+esc(ctaId)+'">'+esc(ctaLabel)+'</button>';
  html+='</div>';
  return html;
}
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function num(id){ var v=val(id); return v===''?null:Number(v); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function fmtDT(iso){ if(!iso) return '—'; var d=new Date(iso); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }

// Koyu (varsayılan) / açık tema seçimi. Marka moru (--leaf) sabit kalır, yalnız
// zemin/metin ters çevrilir; seçim localStorage'da kalıcıdır (bkz. head'deki
// FOUC-önleme betiği, html[data-theme="light"] bloğu).
function initThemeToggle(){
  var btn=document.getElementById('btnThemeToggle');
  if(!btn) return;
  function current(){ try{ return localStorage.getItem('moc_theme')==='light'?'light':'dark'; }catch(e){ return 'dark'; } }
  function paint(t){ btn.textContent = t==='light' ? '☀' : '🌙'; }
  paint(current());
  btn.onclick=function(){
    var next = current()==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next==='light'?'light':'dark');
    try{ localStorage.setItem('moc_theme', next); }catch(e){}
    paint(next);
  };
}

/* ============================================================================
   Onboarding turu (16.09.2026 — Laboratuvar Ekipman Bakım Programı'ndan port)
   Spotlight + ipucu ile MOC menüsünü tanıtır. Bir kez gösterilir (localStorage).
   ========================================================================= */
var MOC_TOUR_DONE_KEY='moc.tourDone';
var MOC_TOUR_STEPS=[
  { sel:'.cardnav-wrap', title:'Menü', text:'Değişiklik Yönetimi\'nin tüm bölümleri burada: Değişiklik Talepleri, Onaylar, Eylemler ve raporlar arasında geçiş yapın.', place:'bottom' },
  { sel:'#sideSearch', title:'Arama', text:'MOC numarası veya başlığa göre anında arama yapın.', place:'bottom' },
  { sel:'#btnNewRequest', title:'Yeni Değişiklik Talebi', text:'Yeni bir değişiklik talebi burada başlatılır: kategori, gerekçe ve etki alanlarını doldurup onaya gönderin.', place:'bottom' },
  { sel:'#sorunBildirBtn', title:'Sorun Bildir', text:'Modülle ilgili bir hata veya öneri fark ederseniz buradan kısaca bildirebilirsiniz.', place:'top' },
  { sel:'#content', title:'Gösterge Paneli', text:'Açık talepler, bekleyen onaylar ve son eylemleri buradan takip edin.', place:'top' }
];
function tourSeen(){ try{ return localStorage.getItem(MOC_TOUR_DONE_KEY)==='1'; }catch(e){ return true; } }
function markTourSeen(){ try{ localStorage.setItem(MOC_TOUR_DONE_KEY,'1'); }catch(e){ /* özel mod */ } }
function startTour(steps){
  steps = steps || MOC_TOUR_STEPS;
  var i=0;
  var overlay=document.createElement('div');
  overlay.className='tour-overlay';
  overlay.innerHTML='<div class="tour-hole" id="tour-hole"></div>'+
    '<div class="tour-pop" id="tour-pop" role="dialog" aria-modal="true" aria-labelledby="tour-title">'+
      '<div class="tour-title" id="tour-title"></div>'+
      '<div class="tour-text" id="tour-text"></div>'+
      '<div class="tour-foot">'+
        '<button class="btn-line sm" id="tour-skip">Geç</button>'+
        '<span style="flex:1"></span>'+
        '<span class="tour-dots" id="tour-dots"></span>'+
        '<button class="btn-line sm" id="tour-prev">←</button>'+
        '<button class="btn-leaf sm" id="tour-next">İleri</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  var hole=overlay.querySelector('#tour-hole');
  var pop=overlay.querySelector('#tour-pop');

  function finish(){ markTourSeen(); overlay.remove(); window.removeEventListener('keydown', onKey); }

  function show(){
    var step=steps[i];
    var el=document.querySelector(step.sel);
    if(!el){ el=document.body; }
    el.scrollIntoView({block:'center', behavior:'smooth'});
    var r=el.getBoundingClientRect();
    var pad=6;
    hole.style.cssText='top:'+(r.top-pad)+'px;left:'+(r.left-pad)+'px;width:'+(r.width+pad*2)+'px;height:'+(r.height+pad*2)+'px';
    overlay.querySelector('#tour-title').textContent=step.title;
    overlay.querySelector('#tour-text').textContent=step.text;
    overlay.querySelector('#tour-dots').textContent=(i+1)+' / '+steps.length;
    overlay.querySelector('#tour-prev').disabled=(i===0);
    overlay.querySelector('#tour-next').textContent=(i===steps.length-1)?'Bitir':'İleri';
    pop.style.visibility='hidden'; pop.style.top='0'; pop.style.left='0';
    requestAnimationFrame(function(){
      var pr=pop.getBoundingClientRect();
      var top, left;
      if(step.place==='right'){ left=r.right+12; top=Math.max(12, r.top); }
      else if(step.place==='top'){ top=Math.max(12, r.top-pr.height-12); left=Math.min(r.left, window.innerWidth-pr.width-12); }
      else { top=r.bottom+12; left=Math.min(Math.max(12, r.left), window.innerWidth-pr.width-12); }
      if(top+pr.height>window.innerHeight-12) top=window.innerHeight-pr.height-12;
      if(left+pr.width>window.innerWidth-12) left=window.innerWidth-pr.width-12;
      pop.style.top=Math.max(12, top)+'px'; pop.style.left=Math.max(12, left)+'px'; pop.style.visibility='visible';
    });
  }

  function next(){ if(i<steps.length-1){ i++; show(); } else finish(); }
  function prev(){ if(i>0){ i--; show(); } }
  function onKey(e){
    if(e.key==='Escape') finish();
    else if(e.key==='ArrowRight' || e.key==='Enter') next();
    else if(e.key==='ArrowLeft') prev();
  }
  overlay.querySelector('#tour-skip').addEventListener('click', finish);
  overlay.querySelector('#tour-next').addEventListener('click', next);
  overlay.querySelector('#tour-prev').addEventListener('click', prev);
  window.addEventListener('keydown', onKey);
  show();
}
</script>
