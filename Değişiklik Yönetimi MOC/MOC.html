<html lang="tr">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Tema — sayfa boyanmadan ÖNCE localStorage'dan okunup <html>'e uygulanır,
     yoksa açık tema seçilmişken ilk karede koyu tema "çakıp" sonra değişir (FOUC). -->
<script>
  try{
    var mocTheme = localStorage.getItem('moc_theme');
    if(mocTheme === 'light'){ document.documentElement.setAttribute('data-theme','light'); }
  }catch(e){}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ============================================================================
   MOC (Değişiklik Yönetimi) — TASARIM_STANDARDI.md §1-§8 birebir uygulanmış
   ========================================================================= */
:root{
  color-scheme:dark;
  --forest:#10241B; --forest-2:#7CD3AD; --forest-3:#1E6B52;
  --leaf:#7C3AED; --leaf-d:#A78BFA; --lime:#C4B5FD; --ink-on-accent:#07120C;
  --sand:#120E17; --card:#1B1626; --mint:#14261C; --mint-2:#101A14;
  --line:#1E2B22; --line-2:#19241D;
  --ink:#F2FBF6; --muted:#8FA397; --accent:#D9C06A;
  --ok:#34D399;   --ok-bg:rgba(16,185,129,.14);
  --warn:#F0A93B; --warn-bg:rgba(240,169,59,.14);
  --crit:#F87171; --crit-bg:rgba(248,113,113,.14);
  --miss:#93A79B; --miss-bg:rgba(147,167,155,.12);
  --na:#5E7268;   --na-bg:rgba(94,114,104,.18);
  --blue:#6FABEF;   --blue-bg:rgba(96,165,250,.14);
  --purple:#B9A5F2; --purple-bg:rgba(167,139,250,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  --bar-track:#243129; --sb-thumb:#22332A; --sb-thumb-h:#2E4437;
}
/* ---- Açık tema (TASARIM_STANDARDI.md ortak paleti; --leaf/--leaf ana mor DEĞİŞMEZ) ---- */
html[data-theme="light"]{
  color-scheme:light;
  --sand:#F2F6F3; --card:#FFFFFF; --mint:#E7F2EC; --mint-2:#EEF5F0;
  --line:#D8E3DB; --line-2:#E3ECE6;
  --ink:#101A13; --muted:#54655A;
  --leaf-d:#6D28D9;
  --ok:#0C8F5E;   --ok-bg:rgba(16,185,129,.13);
  --warn:#9C6A0E; --warn-bg:rgba(240,169,59,.16);
  --crit:#C13D4E; --crit-bg:rgba(248,113,113,.14);
  --shadow:0 1px 2px rgba(16,30,20,.06),0 8px 20px rgba(16,30,20,.08);
  --bar-track:#DCE7E0; --sb-thumb:#C3D3C8; --sb-thumb-h:#AEC2B4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:.2px;margin:0}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bar-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-h)}

/* ---- Login ---- */
#loginScreen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--sand)}
.login-box{width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.login-box h1{font-size:18px;margin-bottom:4px}
.login-box .s{font-size:12px;color:var(--muted);margin-bottom:18px}
.login-box label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.login-box input{width:100%;background:var(--sand);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 11px;font-size:13px;font-family:inherit}
.login-box input:focus{outline:2px solid var(--leaf);border-color:transparent}
#loginMsg{font-size:12px;color:var(--warn);min-height:16px;margin-top:10px}

/* ---- Shell ---- */
#app{display:none;min-height:100vh;flex-direction:column}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.topbar .logo-row{display:flex;align-items:center;gap:9px}
.topbar .logo-mark{width:28px;height:28px;flex-shrink:0}
.topbar .logo-txt .n{font-size:14.5px;font-weight:500;letter-spacing:.4px;color:var(--ink);line-height:1}
.topbar .logo-txt .n b{font-weight:700;background:linear-gradient(90deg,#7C3AED,#C4B5FD);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar h1{font-size:16px;font-weight:700}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar .sp{flex:1}
.topbar .side-search{width:190px}
.topbar .side-search input{width:100%;background:var(--sand);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;font-size:12.5px;font-family:inherit}
#userLabel{font-size:12px;color:var(--muted)}
.content{padding:20px 26px 24px;max-width:1580px;width:100%}

/* ---- Üst kayan kart menü (eski sol menünün yerine) ---- */
.cardnav-wrap{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;position:sticky;top:53px;z-index:39}
.cardnav{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px}
.cardnav::-webkit-scrollbar{height:8px}
.navcard{flex:0 0 216px;height:96px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden;transition:.16s;cursor:pointer;box-shadow:var(--shadow);padding:0 16px;background:linear-gradient(150deg,#16261E 0%,#101D16 55%,#0B140F 100%)}
.navcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120px 90px at 15% 15%, rgba(255,255,255,.05), transparent 70%)}
.navcard .lbl{position:relative;z-index:1;color:var(--ink);font-size:14.5px;font-weight:700;line-height:1.25;letter-spacing:.1px;max-width:120px}
.navcard .card-ico{position:relative;z-index:1;width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.navcard .card-ico svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.navcard .cnt{position:absolute;top:9px;left:14px;z-index:2;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:800;background:rgba(0,0,0,.35);color:#EAF3EC}
.navcard .cnt.warn{background:var(--warn-bg);color:var(--warn)}
.navcard .cnt.crit{background:var(--crit-bg);color:var(--crit)}
.navcard:hover{border-color:var(--leaf-d);transform:translateY(-2px)}
.navcard.on{border:1px solid var(--leaf);background:linear-gradient(150deg,rgba(124,58,237,.20) 0%,#131022 55%,#0D0B18 100%);box-shadow:var(--shadow)}
.navcard.on .card-ico{background:rgba(124,58,237,.18);border-radius:10px}

/* ---- Dashboard ---- */
.dash-section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf-d);font-weight:700;margin:4px 0 10px}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:980px){.dash-grid{grid-template-columns:1fr}}
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.barrow .barlbl{width:150px;flex-shrink:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .bartrack{flex:1;height:9px;background:var(--bar-track);border-radius:5px;overflow:hidden}
.barrow .barfill{height:100%;border-radius:5px;background:linear-gradient(90deg,#6D28D9,#8B5CF6)}
.barrow .barval{width:28px;text-align:right;font-weight:700;flex-shrink:0}
.dash-list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.dash-list-row:last-child{border:none}
.dash-list-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Butonlar ---- */
button,.btn{font-family:inherit;font-size:12.5px;font-weight:600;border-radius:8px;border:1px solid transparent;padding:8px 14px;transition:.12s;cursor:pointer;white-space:nowrap}
.btn-leaf{background:linear-gradient(135deg,#6D28D9,#8B5CF6);color:var(--ink-on-accent);font-weight:700}
.btn-leaf:hover{background:linear-gradient(135deg,#7C3AED,#C4B5FD)}
.btn-line{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-line:hover{border-color:var(--leaf);color:var(--leaf-d)}
.btn-crit{background:var(--crit);color:#1a0d0d;font-weight:700}
.btn-crit:hover{filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:5px 10px;font-size:11.5px}

/* ---- Kartlar ---- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.panel .ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel .ph h2{font-size:15px}
.panel .pb{padding:16px 18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--leaf)}
.kpi.warn::before{background:var(--warn)} .kpi.crit::before{background:var(--crit)}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.5px}
.kpi .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}

/* ---- Tablo ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border:none}
tr.rowclk:hover td{background:var(--mint-2);cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

/* ---- Rozet / pill ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.purple{background:var(--purple-bg);color:var(--purple)} .pill.na{background:var(--na-bg);color:var(--na)}
.pill.miss{background:var(--miss-bg);color:var(--miss)}

/* ---- Form ---- */
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px;margin-bottom:16px}
legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-d);padding:0 8px;font-weight:700}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--sand);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 11px;font-size:13px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);border-color:transparent}
textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;margin-top:8px}
.chk input{width:auto}

/* ---- Uyarı bandı ---- */
.alert-chip{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:16px;border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--warn)}
.alert-chip.crit{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.alert-chip.blue{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}

/* ---- Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(3,9,6,.68);display:none;z-index:90}
.overlay.on{display:block}
.modal-wrap{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:91}
.modal-wrap.on{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.modal.wide{max-width:920px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h2{font-size:15px}
.modal .mb{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:980px){.detail-grid{grid-template-columns:1fr}}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:800;background:var(--mint);color:var(--muted);flex-shrink:0}
.step-badge.done{background:var(--ok-bg);color:var(--ok)}
.step-badge.act{background:var(--leaf);color:var(--ink-on-accent)}
.approval-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.approval-row:last-child{border:none}

/* ---- Checklist hızlı yanıt chip'leri ---- */
.chk-row{padding:10px 0;border-bottom:1px solid var(--line-2)}
.chk-row:last-child{border:none}
.chk-q{font-size:13px;margin-bottom:8px}
.chk-chips{display:flex;gap:6px}
.chkchip{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:11.5px;font-weight:700}
.chkchip:hover:not(:disabled){border-color:var(--leaf);color:var(--leaf-d)}
.chkchip.active-HAYIR{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chkchip.active-EVET{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chkchip.active-NA{background:var(--na-bg);color:var(--na);border-color:transparent}
.chk-gerekce{margin-top:8px}
.chk-gerekce textarea{min-height:50px}
.chk-gerekce .btn-leaf{margin-top:6px}

/* ---- Checklist bölüm accordion'u ---- */
.chk-section{border:1px solid var(--line-2);border-radius:10px;margin-bottom:10px;overflow:hidden}
.chk-section:last-child{margin-bottom:0}
.chk-section-hd{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--mint-2);border:none;border-radius:0;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;text-align:left;font-family:inherit}
.chk-section-hd:hover{background:var(--mint)}
.chk-section-chevron{width:12px;flex-shrink:0;color:var(--leaf-d);font-size:11px}
.chk-section-name{flex:1;min-width:0}
.chk-section-body{display:none;padding:4px 14px 2px}
.chk-section.open .chk-section-body{display:block}
.chk-section.open .chk-section-hd{border-bottom:1px solid var(--line-2)}
.risk-cell{display:inline-flex;width:30px;height:22px;align-items:center;justify-content:center;border-radius:6px;font-weight:800;font-size:11px;color:#07120C}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--crit);color:var(--crit)}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view{animation:fade .18s ease}
</style>
</head>

<!-- ============================ LOGIN ============================ -->
<div id="loginScreen">
  <div class="login-box">
    <div style="display:flex;align-items:center;justify-content:center;gap:11px">
      <svg viewBox="-100 -100 200 200" aria-label="Qdataline" style="width:34px;height:34px;flex-shrink:0">
        <circle cx="0" cy="0" r="78" fill="none" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" stroke-dasharray="425 65" stroke-dashoffset="-34" transform="rotate(45)"/>

<!-- ============================ APP ============================ -->
<div id="app">
  <div class="main">
    <div class="topbar">
      <div class="logo-row">
        <svg class="logo-mark" viewBox="-100 -100 200 200" aria-label="Qdataline">
          <circle cx="0" cy="0" r="78" fill="none" stroke="#7C3AED" stroke-width="18" stroke-linecap="round" stroke-dasharray="425 65" stroke-dashoffset="-34" transform="rotate(45)"/>
          <path d="M 30 30 L 58 58 L 84 42" fill="none" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- ============================ MODAL ============================ -->
<div class="overlay" id="overlay"></div>
<div class="modal-wrap" id="modalWrap">
  <div class="modal" id="modalBox">
    <div class="mh"><h2 id="modalTitle"></h2></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf">
      <button class="btn-line" id="modalCancel">Kapat</button>
      <button class="btn-leaf" id="modalSave" style="display:none"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   MOC — Config (Ekipman projesiyle AYNI Supabase projesi: bbltvuxxtacrpgrqnfoh)
   ========================================================================= */
var SUPABASE_URL = 'https://bbltvuxxtacrpgrqnfoh.supabase.co';
var SUPABASE_KEY = 'sb_publishable_3UUYAbeaA4tJahYiAAGhLQ_AtDfHkq4';

/* Faz 3.3 SSO (2026-08-26): .qdataline.com paylaşımlı cookie oturumu — kod Ekipman index.html ile birebir aynı. */
function qdlCookieAuthStorage(){
  var DOMAIN=/(^|\.)qdataline\.com$/.test(location.hostname)?'.qdataline.com':'';
  var SECURE=location.protocol==='https:'?'; Secure':'';
  var CHUNK=3500;
  function setCookie(name,value,days){
    var attrs='; Path=/; Max-Age='+(days*86400)+'; SameSite=Lax'+SECURE+(DOMAIN?'; Domain='+DOMAIN:'');
    document.cookie=name+'='+encodeURIComponent(value)+attrs;
  }
  function getCookie(name){
    var re=new RegExp('(?:^|; )'+name.replace(/[.$?*|{}()\[\]\\\/+^]/g,'\\$&')+'=([^;]*)');
    var m=document.cookie.match(re);
    return m?decodeURIComponent(m[1]):null;
  }
  function delCookie(name){ document.cookie=name+'=; Path=/; Max-Age=0'+(DOMAIN?'; Domain='+DOMAIN:''); }
  function clearChunks(key){ delCookie(key); for(var i=0;;i++){ if(getCookie(key+'.'+i)==null) break; delCookie(key+'.'+i); } }
  return {
    getItem:function(key){
      var val=getCookie(key);
      if(val==null){ var p0=getCookie(key+'.0'); if(p0!=null){ var parts=[p0],i=1,p; while((p=getCookie(key+'.'+i))!=null){ parts.push(p); i++; } val=parts.join(''); } }
      if(val!=null) return val;
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    },
    setItem:function(key,value){
      try{ localStorage.setItem(key,value); }catch(e){}
      try{
        clearChunks(key);
        if(value.length<=CHUNK){ setCookie(key,value,30); }
        else{ for(var i=0;i*CHUNK<value.length;i++){ setCookie(key+'.'+i,value.slice(i*CHUNK,(i+1)*CHUNK),30); } }
      }catch(e){}
    },
    removeItem:function(key){
      try{ localStorage.removeItem(key); }catch(e){}
      try{ clearChunks(key); }catch(e){}
    }
  };
}

/* ============================================================================
   RBAC — basitleştirilmiş eşleme (bkz. CLAUDE.md "Bilinen sınırlamalar")
   Platformun paylaşılan profiles.role kolonu (ADMIN/EDITOR/VIEWER) kullanılır;
   moc_rbac_matrix_v1.md'deki 14 ayrı izin kodu yerine 3 kademeye indirgendi.
   Kayıt-seviyesi kurallar (kendi talebini onaylayamama, atanmış onaycı vb.)
   tam olarak uygulanıyor — bkz. canDecideApproval().
   ========================================================================= */
function canDo(action){
  // action: 'create' | 'screen' | 'coordinate' | 'risk' | 'review' | 'pssr' | 'close' | 'admin' | 'reopen'
  if(cloudRole==='ADMIN') return true;
  if(cloudRole==='EDITOR') return action!=='admin' && action!=='reopen';
  return action==='create'; // VIEWER = taban izin (herkes MOC başlatabilir)
}
function isOwner(req){ return req && req.initiator_id===cloudUserId; }
function canEditDraft(req){ return isOwner(req) || canDo('coordinate'); }

/* ============================================================================
   DURUM MAKİNESİ — moc_state_machine_v1.md §3 (tek doğruluk kaynağı)
   Her giriş: { to, action, cond(req,ctx) } — cond opsiyonel.
   ========================================================================= */
var TRANSITIONS = {
  DRAFT:            [ {to:'SCREENING', action:'create', cond:condDraftReady},
                       {to:'CANCELLED', action:'create'} ],
  SCREENING:        [ {to:'RISK_ASSESSMENT', action:'screen'},
                       {to:'CLOSED', action:'screen', cond:function(r){return !!r.is_rik;}},
                       {to:'REJECTED', action:'screen', cond:function(r){return !!(r.reason&&r.reason.trim());}} ],
  RISK_ASSESSMENT:  [ {to:'TECHNICAL_REVIEW', action:'risk', cond:function(r,ctx){return (ctx.risks||[]).length>0;}} ],
  TECHNICAL_REVIEW: [ {to:'APPROVAL', action:'review', cond:condReadyForApproval},
                       {to:'RISK_ASSESSMENT', action:'review'} ],
  APPROVAL:         [ ], // sistem otomatik ilerletir (bkz. checkApprovalAuto)
  IMPLEMENTATION:   [ {to:'DOC_UPDATE', action:'coordinate', cond:condActionsDone('IMPLEMENTATION')} ],
  DOC_UPDATE:       [ {to:'TRAINING', action:'coordinate', cond:condAffectedDocsDone} ],
  TRAINING:         [ {to:'PSSR', action:'coordinate', cond:function(r,ctx){return !!(ctx.type&&ctx.type.requires_pssr) && condTrainingDone(r,ctx);}},
                       {to:'STARTUP', action:'coordinate', cond:function(r,ctx){return !(ctx.type&&ctx.type.requires_pssr) && condTrainingDone(r,ctx);}} ],
  PSSR:             [ {to:'STARTUP', action:'pssr', cond:function(r,ctx){return !!(ctx.pssr&&ctx.pssr.result==='RELEASED') && condPssrChecklistAnswered(r,ctx) && condActionsDone('PSSR')(r,ctx);}},
                       {to:'IMPLEMENTATION', action:'pssr', cond:function(r,ctx){return ctx.pssr&&ctx.pssr.result==='NOT_RELEASED';}, after:resetPssrResult} ],
  STARTUP:          [ {to:'CLOSED', action:'close', cond:condNoOpenActions} ],
  CLOSED:[], REJECTED:[], CANCELLED:[]
};
function condDraftReady(r){
  if(!r.title || !r.category_id || !r.type_id) return false;
  return true; // planned_end zorunluluğu form katmanında ayrıca doğrulanır
}
function condActionsDone(phase){
  return function(r,ctx){
    var items=(ctx.actions||[]).filter(function(a){return a.phase===phase;});
    return items.length===0 || items.every(function(a){return a.status==='DONE'||a.status==='CANCELLED';});
  };
}
function condNoOpenActions(r,ctx){
  return (ctx.actions||[]).every(function(a){return a.status==='DONE'||a.status==='CANCELLED';});
}
/* "MOC doğrular, Doküman Yönetimi uygular" — MOC kendi içine doküman kopyası yazmaz;
   ggd_sablonlar'daki GÜNCEL versiyon/durumu canlı okuyup fotoğraflanan (snapshot)
   versiyonla kıyaslar. Etkilenen doküman işaretlenmediyse (items.length===0) engel yok
   — geriye dönük uyumluluk, condActionsDone ile aynı desen. */
function computeAffectedDocStatus(d, ctx){
  var live=(ctx.affectedDocsLive||[]).find(function(s){return String(s.id)===String(d.doc_ref);});
  if(!live) return {code:'MISSING', label:t('Doküman bulunamadı')};
  var snapVer=parseInt(d.old_version,10)||0;
  if(live.versiyon_no>snapVer && live.durum==='Yürürlükte') return {code:'YURURLUKTE', label:t('Yürürlükte'), live:live};
  if(live.versiyon_no>snapVer) return {code:'TASLAK', label:t('Taslakta Bekliyor'), live:live};
  return {code:'GUNCELLENMEDI', label:t('Güncellenmedi'), live:live};
}
function condAffectedDocsDone(r,ctx){
  var items=(ctx.docs||[]).filter(function(d){return d.doc_kind==='AFFECTED_DOC';});
  return items.length===0 || items.every(function(d){return computeAffectedDocStatus(d,ctx).code==='YURURLUKTE';});
}
/* TRAINING adımı — moc_trainings zaten şemada vardı ama hiç kullanılmıyordu (bkz. 2026-09-07
   denetimi). Atanan her kayıt acknowledged=true olmadan bir sonraki adıma geçilemez; hiç
   atama yapılmadıysa (items.length===0) engel yok. */
function condTrainingDone(r,ctx){
  var items=ctx.trainings||[];
  return items.length===0 || items.every(function(tr){return !!tr.acknowledged;});
}
/* Onaya geçiş için: etki değerlendirme checklist'i tamamen yanıtlanmış ve
   "Evet + aksiyon gerekli" cevaplarının doğurduğu PRE_APPROVAL aksiyonları
   kapanmış (DONE/CANCELLED) olmalı. */
function condReadyForApproval(r,ctx){
  /* DÜZELTME (2026-09-05) — KALICI KİLİT 1: APPROVAL'dan çıkışın tek yolu checkApprovalAuto(),
     o da yalnız bir onay kararı verildiğinde çalışıyor. Onay adımı tanımlanmadan APPROVAL'a
     geçilirse karar verilecek adım da, adım ekleyecek düğme de olmadığı için talep SONSUZA
     KADAR kilitleniyordu (kurtarma yalnız SQL ile). Artık en az bir onay adımı olmadan
     onaya geçilemez; ayrıca renderApprovalsPanel APPROVAL durumunda da adım eklemeye izin
     verir, böylece bu hataya daha önce düşmüş kayıtlar arayüzden kurtarılabilir. */
  return condChecklistAnswered(r,ctx) && condActionsDone('PRE_APPROVAL')(r,ctx)
      && (ctx.approvals||[]).length > 0;
}
/* PSSR→STARTUP geçişi için: durum-tetiklemeli PSSR checklist'i tamamen
   yanıtlanmış ve doğurduğu PSSR fazlı aksiyonlar kapanmış olmalı. */
function condPssrChecklistAnswered(r,ctx){
  var items = applicablePssrChecklistItems();
  if(!items.length) return true;
  var answeredIds = (ctx.checklistAnswers||[]).filter(function(a){return a.cevap;}).map(function(a){return a.madde_id;});
  return items.every(function(m){return answeredIds.indexOf(m.id)>=0;});
}

/* DÜZELTME (2026-09-05): dosyada tek bir .range()/.limit() yoktu. PostgREST bir sorguda
   varsayılan olarak EN FAZLA 1000 satır döndürür ve bunu hiçbir yerde belirtmez. En tehlikeli
   yer checklist maddeleri: liste kırpılırsa `condChecklistAnswered()` eksik maddeleri
   "yanıtlanmamış" saymaz — HİÇ GÖRMEZ — ve `TECHNICAL_REVIEW → APPROVAL` kilidi sessizce
   açılır, cevaplanmamış güvenlik soruları atlanır. Bir değişiklik yönetimi modülünde bu
   doğrudan güvenlik sonucu doğurur. Bu yardımcı sayfa sayfa çekip tamamını toplar. */
function tumSatirlar(sorguKur, sayfa){
  sayfa = sayfa || 1000;
  var hepsi = [];
  function tur(bas){
    return sorguKur().range(bas, bas + sayfa - 1).then(function(res){
      if(res.error) throw res.error;
      var d = res.data || [];
      hepsi = hepsi.concat(d);
      if(d.length < sayfa) return hepsi;
      return tur(bas + sayfa);
    });
  }
  return tur(0);
}
var CATEGORIES=[], TYPES=[], ALL_CATEGORIES=[], ALL_TYPES=[];

/* ============================================================================
   Maliyet Takibi — çoklu para birimi + güncel kur çevrimi (Frankfurter API,
   ECB referans kurları, ücretsiz, key gerektirmiyor, CORS açık — test edildi).
   TRY dahil (ECB kapsamında). Kurlar oturum başına bir kez çekilir, base=TRY
   ile alınır (rates[X] = 1 TRY karşılığı kaç X birimi), TRY'ye çevirirken
   amount / rates[X] uygulanır. Servis erişilemezse ham değer gösterilir,
   çevrim "—" olarak işaretlenir (sessizce yanlış rakam üretilmez).
   ========================================================================= */
var MOC_CURRENCIES=['TRY','USD','EUR','GBP'];
var EXCHANGE_RATES={TRY:1}, EXCHANGE_DATE=null, EXCHANGE_READY=false;
function fetchExchangeRates(){
  return fetch('https://api.frankfurter.app/latest?base=TRY&symbols='+MOC_CURRENCIES.filter(function(c){return c!=='TRY';}).join(','))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j&&j.rates){ EXCHANGE_RATES=Object.assign({TRY:1}, j.rates); EXCHANGE_DATE=j.date; EXCHANGE_READY=true; }
    })
    .catch(function(){ EXCHANGE_READY=false; });
}
function convertToTRY(amount, currency){
  if(amount==null||isNaN(amount)) return null;
  if(!currency||currency==='TRY') return amount;
  var rate=EXCHANGE_RATES[currency];
  if(!rate) return null;
  return amount/rate;
}
function fmtMoney(n){ if(n==null||isNaN(n)) return '—'; return n.toLocaleString('tr-TR',{maximumFractionDigits:2}); }
function fmtCostTRY(amount, currency){
  var tl=convertToTRY(amount, currency);
  if(currency==='TRY'||!currency) return fmtMoney(amount)+' ₺';
  return fmtMoney(amount)+' '+currency+(tl!=null?' (güncel kurla ~'+fmtMoney(tl)+' ₺)':' (kur alınamadı)');
}

/* ============================================================================
   Etki Değerlendirme Checklist — hangi setler bu MOC talebine uygulanır
   Zorunlu (kategori_id NULL) setler: global + tenant'ın kendi ek setleri.
   Opsiyonel (kategori_id dolu) setler: yalnız tenant "Kullan" ile kendi
   kopyasını oluşturduysa devreye girer — global şablon doğrudan kullanılmaz.
   ========================================================================= */
function applicableChecklistSets(categoryId){
  return (CHECKLIST_SETS||[]).filter(function(s){
    if(!s.aktif) return false;
    if(s.tetik_tipi!=='kategori') return false;
    if(s.kategori_id===null) return s.tenant_id===null || s.tenant_id===cloudTenantId;
    return s.kategori_id===categoryId && s.tenant_id===cloudTenantId;
  });
}
function applicableChecklistItems(categoryId){
  var setIds = applicableChecklistSets(categoryId).map(function(s){return s.id;});
  return (CHECKLIST_ITEMS||[]).filter(function(m){return setIds.indexOf(m.set_id)>=0;})
    .sort(function(a,b){return a.sira_no-b.sira_no;});
}
/* Durum/adım tetiklemeli setler (ör. PSSR) — kategoriden bağımsız, yalnız
   tetik_durum_kodu eşleşen adıma gelindiğinde ilgili panelde gösterilir. */
function applicablePssrChecklistSets(){
  return (CHECKLIST_SETS||[]).filter(function(s){
    if(!s.aktif) return false;
    if(s.tetik_tipi!=='durum' || s.tetik_durum_kodu!=='PSSR') return false;
    return s.tenant_id===null || s.tenant_id===cloudTenantId;
  });
}
function applicablePssrChecklistItems(){
  var setIds = applicablePssrChecklistSets().map(function(s){return s.id;});
  return (CHECKLIST_ITEMS||[]).filter(function(m){return setIds.indexOf(m.set_id)>=0;})
    .sort(function(a,b){return a.sira_no-b.sira_no;});
}
function condChecklistAnswered(r,ctx){
  var items = applicableChecklistItems(r.category_id);
  if(!items.length) return true;
  var answeredIds = (ctx.checklistAnswers||[]).filter(function(a){return a.cevap;}).map(function(a){return a.madde_id;});
  return items.every(function(m){return answeredIds.indexOf(m.id)>=0;});
}

/* ============================================================================
   Dashboard (Genel Bakış) — üst kart menüsünün altındaki özet alan.
   KPI'lar: açık MOC sayısı, onay bekleyen sayısı (kişisel kuyruk, "Onay
   Bekleyenler" ile aynı activeApprovalStep mantığı), toplam başlangıç/
   sapma maliyeti (TRY'ye çevrilmiş). Ayrıca kategori dağılımı (basit çubuk
   grafik) ve T-7 içinde biten/geçmiş geçici değişiklikler listesi.
   ========================================================================= */
function viewDashboard(){
  document.getElementById('pageTitle').textContent=t('Özet');
  document.getElementById('pageCrumb').textContent='';
  document.getElementById('content').innerHTML='<div class="empty">'+t('Yükleniyor…')+'</div>';
  var TERMINAL=['CLOSED','REJECTED','CANCELLED'];
  Promise.all([
    sb.from('moc_requests').select('*').is('deleted_at',null),
    sb.from('moc_approvals').select('*, moc_requests(*)').order('step_order')
  ]).then(function(res){
    var reqs=res[0].data||[];
    var open=reqs.filter(function(r){ return TERMINAL.indexOf(r.status)<0; });

    var approvalRows=res[1].data||[];
    var byMoc={};
    approvalRows.forEach(function(a){ (byMoc[a.moc_id]=byMoc[a.moc_id]||[]).push(a); });
    var pendingCount=0;
    Object.keys(byMoc).forEach(function(mid){
      var list=byMoc[mid], req=list[0]&&list[0].moc_requests;
      if(!req||req.status!=='APPROVAL') return;
      var active=activeApprovalStep(list);
      if(!active) return;
      if(req.initiator_id===cloudUserId) return;
      if(cloudRole==='VIEWER') return;
      if(active.approver_id && active.approver_id!==cloudUserId) return;
      pendingCount++;
    });

    var catCounts={};
    open.forEach(function(r){ var k=r.category_id||0; catCounts[k]=(catCounts[k]||0)+1; });
    var catBars=Object.keys(catCounts).map(function(k){
      var c=catById(Number(k));
      return {name:c?c.name_tr:'Diğer', count:catCounts[k]};
    }).sort(function(a,b){return b.count-a.count;});
    var maxCat=catBars.reduce(function(m,x){return Math.max(m,x.count);},1);

    var tempList=open.map(function(r){
      var t=typeById(r.type_id);
      if(!t||!t.requires_end_date||!r.planned_end) return null;
      return {req:r, days:daysLeft(r.planned_end)};
    }).filter(function(x){ return x && x.days<=7; }).sort(function(a,b){return a.days-b.days;});

    var costTotalStart=0, costTotalDeviation=0, costCount=0;
    reqs.forEach(function(r){
      var s=convertToTRY(r.baslangic_maliyeti, r.para_birimi);
      if(s!=null){ costTotalStart+=s; costCount++; }
      var d=convertToTRY(r.sapma_tutari, r.para_birimi);
      if(d!=null) costTotalDeviation+=d;
    });

    renderDashboardHtml({
      openCount:open.length, pendingCount:pendingCount, catBars:catBars, maxCat:maxCat,
      tempList:tempList, costTotalStart:costTotalStart, costTotalDeviation:costTotalDeviation, costCount:costCount
    });
  });
}

  html+= d.catBars.length ? d.catBars.map(function(b){

/* ============================================================================
   Liste görünümleri
   ========================================================================= */
function viewList(kind){
  document.getElementById('pageTitle').textContent = t(kind==='mine'?'Değişiklik Talepleri':kind==='pending'?'Onay Bekleyenler':'Tüm Değişiklikler');
  document.getElementById('pageCrumb').textContent='';
  document.getElementById('content').innerHTML='<div class="empty">'+t('Yükleniyor…')+'</div>';

  if(kind==='pending'){
    /* Kök sebep düzeltmesi: eskiden `approver_id = cloudUserId` filtreleniyordu,
       ama approver_id yalnız karar VERİLDİĞİNDE set edilir (üstlenme modeli) —
       yani decision NULL olduğu sürece approver_id de asla dolu olamaz, bu liste
       hiç kimse için hiçbir zaman dolmuyordu. Doğru mantık: her MOC için, sıralı
       zincirdeki AKTİF adımı (activeApprovalStep) bul, o adımı kararlaştırma
       yetkisi olan (talep sahibi değil, VIEWER değil, başka birine kilitli
       değil) kullanıcılara göster. */
    /* DÜZELTME (2026-09-05): (a) sayfalama yoktu, 1000'i aşan onayda liste sessizce
       eksik kalıyordu; (b) soft-delete filtresi yoktu — gizlenmiş bir talep "Onay
       Bekleyenler"de durmaya devam ediyor ve onaylanabiliyordu. */
    tumSatirlar(function(){ return sb.from('moc_approvals').select('*, moc_requests(*)').order('step_order'); })
      .then(function(rows){
        var byMoc={};
        rows.forEach(function(a){ (byMoc[a.moc_id]=byMoc[a.moc_id]||[]).push(a); });
        var pending=[];
        Object.keys(byMoc).forEach(function(mid){
          var list=byMoc[mid];
          var req=list[0]&&list[0].moc_requests;
          if(!req || req.status!=='APPROVAL') return;
          if(req.deleted_at) return;   /* gizlenmiş talep onay kuyruğunda görünmez */
          var active=activeApprovalStep(list);
          if(!active) return;
          if(req.initiator_id===cloudUserId) return;
          if(cloudRole==='VIEWER') return;
          if(active.approver_id && active.approver_id!==cloudUserId) return;
          pending.push(active);
        });
        renderApprovalQueue(pending);
      }).catch(function(e){ toast(hataMesaji(e), true); });
    return;
  }
  tumSatirlar(function(){
    var q = sb.from('moc_requests').select('*').is('deleted_at',null).order('created_at',{ascending:false});
    if(kind==='mine') q = q.eq('initiator_id',cloudUserId);
    return q;
  }).then(function(rows){
    LISTE_SATIRLARI = rows; LISTE_TURU = kind;
    renderRequestTable(filtreliListe(), kind);
  }).catch(function(e){ toast(hataMesaji(e), true); });
}
/* DÜZELTME (2026-09-05): üstteki arama kutusu ekranda duruyordu ama hiçbir olaya bağlı
   değildi — kullanıcı yazıyor, hiçbir şey olmuyordu. Listeler zaten bellekte olduğu için
   sunucuya gitmeye gerek yok; MOC numarası ve başlıkta yerel filtre yeterli. */
var LISTE_SATIRLARI=[], LISTE_TURU='mine', ARAMA='';
function filtreliListe(){
  var q=(ARAMA||'').trim().toLocaleLowerCase('tr-TR');
  if(!q) return LISTE_SATIRLARI;
  return LISTE_SATIRLARI.filter(function(r){
    var hay=[r.moc_no, r.title, r.description].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');
    return hay.indexOf(q)>=0;
  });
}
function bindListeAramasi(){
  var el=document.getElementById('sideSearch');
  if(!el || el.dataset.bagli) return;
  el.dataset.bagli='1';
  el.addEventListener('input', function(){
    ARAMA=el.value;
    if(document.getElementById('content') && LISTE_SATIRLARI.length){
      renderRequestTable(filtreliListe(), LISTE_TURU);
    }
  });
}
function renderApprovalQueue(rows){
  if(!rows.length){ document.getElementById('content').innerHTML='<div class="panel"><div class="empty">'+t('Bekleyen onayınız yok.')+'</div></div>'; return; }
  var body=rows.map(function(a){
    var r=a.moc_requests;
    return '<tr class="rowclk" data-id="'+r.id+'"><td>'+esc(r.moc_no||('#'+r.id))+'</td><td>'+esc(r.title)+'</td>'
      +'<td>'+t('Adım')+' '+a.step_order+' · '+esc(a.role_code)+'</td><td>'+statusPill(r.status)+'</td></tr>';
  }).join('');
  document.getElementById('content').innerHTML='<div class="panel"><table><thead><tr><th>'+t('MOC No')+'</th><th>'+t('Başlık')+'</th><th>'+t('Onay Adımı')+'</th><th>'+t('Durum')+'</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  bindRowClicks();
}
function renderRequestTable(rows, kind){
  if(!rows.length){ document.getElementById('content').innerHTML='<div class="panel"><div class="empty">'+t('Kayıt yok.')+'</div></div>'; return; }
  var body=rows.map(function(r){
    var typ=typeById(r.type_id), c=catById(r.category_id);
    var tempBadge='';
    if(typ&&typ.requires_end_date&&r.planned_end&&!['CLOSED','REJECTED','CANCELLED'].includes(r.status)){
      tempBadge=' '+tempWarnPill(r.planned_end);
    }
    var rowActions='';
    if(canManageRequest(r)){
      rowActions='<button class="sm btn-line rowedit" data-id="'+r.id+'">'+t('Düzenle')+'</button> '
        +'<button class="sm btn-crit rowdel" data-id="'+r.id+'">'+t('Sil')+'</button>';
    }
    return '<tr class="rowclk" data-id="'+r.id+'">'
      +'<td>'+esc(r.moc_no||('#'+r.id))+'</td>'
      +'<td>'+esc(r.title)+'</td>'
      +'<td>'+(c?esc(c.name_tr):'—')+'</td>'
      +'<td>'+(typ?esc(typ.name_tr):'—')+'</td>'
      +'<td>'+statusPill(r.status)+tempBadge+'</td>'
      +'<td>'+(r.priority==='EMERGENCY'?'<span class="pill crit">'+t('Acil')+'</span>':'')+'</td>'
      +'<td>'+rowActions+'</td>'
      +'</tr>';
  }).join('');
  document.getElementById('content').innerHTML='<div class="panel"><table><thead><tr><th>'+t('MOC No')+'</th><th>'+t('Başlık')+'</th><th>'+t('Kategori')+'</th><th>'+t('Akış Türü')+'</th><th>'+t('Durum')+'</th><th></th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
  bindRowClicks(rows);
}
function bindRowClicks(rows){
  Array.prototype.forEach.call(document.querySelectorAll('tr.rowclk'),function(tr){
    tr.onclick=function(){ go('detail', Number(tr.getAttribute('data-id'))); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.rowedit'),function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var r=(rows||[]).find(function(x){return x.id===Number(b.getAttribute('data-id'));});
      if(r) editRequestFlow(r);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.rowdel'),function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var r=(rows||[]).find(function(x){return x.id===Number(b.getAttribute('data-id'));});
      if(r) deleteRequestFlow(r);
    };
  });
}
/* ============================================================================
   Düzenle / Sil — Taleplerim ve Tüm Değişiklikler listeleri (Q-Tedarikçi
   Faz D.1 güvenli silme deseniyle aynı ruhta, bkz. moc_schema_faz_d.sql).
   Yetki: koordinasyon izni (EDITOR/ADMIN) HERHANGİ bir talebi yönetebilir;
   taban roldeki (VIEWER) kullanıcı kendi talebi olsa dahi yönetemez —
   talep OLUŞTURMA taban izindir ama düzenleme/silme değildir.
   ========================================================================= */
function canManageRequest(r){
  return canDo('coordinate') || (isOwner(r) && cloudRole!=='VIEWER');
}
function editRequestFlow(req){
  if(['CLOSED','REJECTED','CANCELLED'].includes(req.status)){
    toast('Terminal durumdaki ('+t(STATUS_LABEL[req.status])+') bir talep düzenlenemez.',true);
    return;
  }
  var locked = req.status!=='DRAFT';
  document.getElementById('modalTitle').textContent = locked?(t('Talebi Düzenle')+' ('+t('kısıtlı')+' — '+t(STATUS_LABEL[req.status])+')'):t('Talebi Düzenle');
  if(locked){
    setModalBody(
      '<p class="hint" style="margin-bottom:12px">Bu talebin akışı başlamış durumda — kategori/tür/öncelik gibi checklist ve onay zincirini belirleyen alanlar kilitli. Yalnız başlık/açıklama/gerekçe ve maliyet alanları düzenlenebilir.</p>'
      +'<label>Başlık</label><input id="fTitle" value="'+esc(req.title||'')+'">'
      +'<label>Açıklama</label><textarea id="fDesc">'+esc(req.description||'')+'</textarea>'
      +'<label>Gerekçe</label><textarea id="fReason">'+esc(req.reason||'')+'</textarea>'
      +'<fieldset><legend>Maliyet Takibi</legend>'
      +'<div class="row2"><div><label>Para Birimi</label><select id="fCurrency">'+MOC_CURRENCIES.map(function(c){return '<option value="'+c+'"'+(c===(req.para_birimi||'TRY')?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'
      +'<div><label>Başlangıç Maliyeti</label><input id="fCostStart" type="number" step="0.01" min="0" value="'+(req.baslangic_maliyeti!=null?req.baslangic_maliyeti:'')+'"></div></div>'
      +'<label>Tamamlanma Sonrası Maliyet</label><input id="fCostEnd" type="number" step="0.01" min="0" value="'+(req.tamamlanma_sonrasi_maliyet!=null?req.tamamlanma_sonrasi_maliyet:'')+'">'
      +'<p class="hint">Sapma tutarı/yüzdesi bu iki değerden otomatik hesaplanır.</p>'
      +'</fieldset>'
    );
    modalFoot('Kaydet','Vazgeç',function(){
      var title=val('fTitle');
      if(!title.trim()){ toast('Başlık zorunlu.',true); return; }
      sb.from('moc_requests').update({title:title, description:val('fDesc'), reason:val('fReason'),
        para_birimi:val('fCurrency')||'TRY', baslangic_maliyeti:num('fCostStart'), tamamlanma_sonrasi_maliyet:num('fCostEnd')}).eq('id',req.id).then(function(res){
        if(res.error){ toast(hataMesaji(res.error),true); return; }
        closeModal(); toast('Kaydedildi'); go(CURRENT_VIEW);
      });
    });
  } else {
    setModalBody(requestFormHtml());
    fillRequestForm(req);
    modalFoot('Kaydet','Vazgeç',function(){
      var patch=readRequestForm();
      if(!patch) return;
      sb.from('moc_requests').update(patch).eq('id',req.id).then(function(res){
        if(res.error){ toast(hataMesaji(res.error),true); return; }
        closeModal(); toast('Kaydedildi'); go(CURRENT_VIEW);
      });
    });
  }
  openModal();
}
function deleteRequestFlow(req){
  sb.from('moc_action_items').select('id,status').eq('moc_id',req.id).then(function(res){
    if(res.error){ toast(hataMesaji(res.error),true); return; }
    var openActs=(res.data||[]).filter(function(a){return a.status!=='DONE'&&a.status!=='CANCELLED';});
    if(openActs.length){
      toast('Bu talebe bağlı '+openActs.length+' açık aksiyon var — önce aksiyonları kapatın.',true);
      return;
    }
    var hardDelete = req.status==='DRAFT';
    var msg = hardDelete
      ? 'Taslak "<b>'+esc(req.title)+'</b>" kalıcı olarak silinsin mi? Bu işlem geri alınamaz.'
      : '"<b>'+esc(req.title)+'</b>" ('+t(STATUS_LABEL[req.status])+') '+t('silinsin mi? Geçmişin korunması için kayıt yalnızca gizlenecek, veritabanında kalacaktır.');
    confirmBox(msg,'Sil',function(){
      var op = hardDelete
        ? sb.from('moc_requests').delete().eq('id',req.id)
        : sb.from('moc_requests').update({deleted_at:new Date().toISOString()}).eq('id',req.id);
      op.then(function(res2){
        if(res2.error){ toast(hataMesaji(res2.error),true); return; }
        closeModal(); toast(hardDelete?'Talep kalıcı silindi':'Talep gizlendi'); go(CURRENT_VIEW);
      });
    },true);
  });
}
function statusPill(s){ return '<span class="pill '+(STATUS_PILL[s]||'na')+'">'+t(STATUS_LABEL[s]||s)+'</span>'; }
function tempWarnPill(expires){
  var d=daysLeft(expires);
  if(d<0) return '<span class="pill crit">'+t('Süresi geçti')+' ('+Math.abs(d)+' '+t('gün')+')</span>';
  if(d<=1) return '<span class="pill crit">T-'+d+' · '+t('son gün')+'</span>';
  if(d<=7) return '<span class="pill warn">T-'+d+' '+t('gün')+'</span>';
  return '';
}
function daysLeft(iso){ var t=new Date(todayISO()+'T00:00:00'), e=new Date(iso+'T00:00:00'); return Math.round((e-t)/86400000); }

/* ============================================================================
   Detay görünümü
   ========================================================================= */
var DETAIL_CTX={};
function viewDetail(id){
  document.getElementById('content').innerHTML='<div class="empty">'+t('Yükleniyor…')+'</div>';
  Promise.all([
    sb.from('moc_requests').select('*').eq('id',id).maybeSingle(),
    sb.from('moc_risk_assessments').select('*').eq('moc_id',id).order('created_at'),
    sb.from('moc_approvals').select('*').eq('moc_id',id).order('step_order'),
    sb.from('moc_action_items').select('*').eq('moc_id',id).order('created_at'),
    sb.from('moc_pssr_checklists').select('*').eq('moc_id',id).eq('is_template',false).order('created_at'),
    sb.from('moc_temporary_tracking').select('*').eq('moc_id',id).maybeSingle(),
    sb.from('moc_etki_checklist_yanitlari').select('*').eq('moc_request_id',id),
    sb.from('moc_documents').select('*').eq('moc_id',id).order('created_at',{ascending:false}),
    sb.from('moc_audit_log').select('*').eq('record_id',id).in('table_name',['moc_requests','moc_approvals','moc_risk_assessments']).order('created_at',{ascending:false}).limit(200),
    sb.from('moc_trainings').select('*').eq('moc_id',id).order('created_at')
  ]).then(function(res){
    /* DÜZELTME (2026-09-05): bu yedi sorgunun HİÇBİRİNİN `error` alanı kontrol edilmiyordu.
       Mükerrer PSSR checklist'i .maybeSingle()'ı hataya düşürüyor, hata yutulduğu için panel
       "Checklist henüz oluşturulmadı" göstermeye devam ediyor ve her tıklamada bir satır daha
       ekleniyordu — PSSR→STARTUP bir daha mümkün olmuyordu (KALICI KİLİT 3). Artık hata
       görünür; PSSR sorgusu ayrıca çoğul okumaya çevrildi ki mükerrer kayıt paneli
       kilitlemek yerine uyarıyla çalışmaya devam etsin. */
    var hataliSorgu = res.find(function(r){ return r && r.error; });
    if(hataliSorgu) toast(hataMesaji(hataliSorgu.error), true);
    var req=res[0].data;
    if(!req){ document.getElementById('content').innerHTML='<div class="empty">'+t('Kayıt bulunamadı.')+'</div>'; return; }
    DETAIL_CTX = { req:req, risks:res[1].data||[], approvals:res[2].data||[], actions:res[3].data||[],
                   pssr:(res[4].data&&res[4].data[0])||null, temp:res[5].data||null, checklistAnswers:res[6].data||[],
                   docs:res[7].data||[], gecmis:res[8].data||[], trainings:res[9].data||[],
                   affectedDocsLive:[],
                   type:typeById(req.type_id), category:catById(req.category_id) };
    document.getElementById('pageTitle').textContent = req.moc_no || ('MOC #'+req.id);
    document.getElementById('pageCrumb').textContent = req.title;
    /* DOC_UPDATE adımının CANLI kontrolü: MOC'ta "etkilenen doküman" olarak işaretlenmiş
       her kayıt için Doküman Yönetimi'ndeki (ggd_sablonlar) GÜNCEL versiyon/durum çekilir.
       Karşılaştırma renderDetail() içinde (computeAffectedDocStatus) yapılır — burada
       sadece canlı veri getirilir, kopyası MOC tarafında SAKLANMAZ. */
    var etkilenenler=(DETAIL_CTX.docs||[]).filter(function(d){return d.doc_kind==='AFFECTED_DOC' && d.doc_ref;});
    var refIds=etkilenenler.map(function(d){return d.doc_ref;});
    if(!refIds.length){ renderDetail(); return; }
    sb.from('ggd_sablonlar').select('id,baslik,versiyon_no,durum').in('id',refIds).then(function(sr){
      if(sr.error) toast(hataMesaji(sr.error), true);
      DETAIL_CTX.affectedDocsLive = sr.data||[];
      renderDetail();
    });
  });
}

    docs.forEach(function(d){
      html+='<tr><td>'+esc(d.title||'—')+'</td>'

function dosyaBoyutu(b){
  if(!b) return '—';
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function docYukle(files){
  if(!files || !files.length) return;
  var req=DETAIL_CTX.req;
  var isler=Array.prototype.map.call(files, function(file){
    /* Dosya adı temizlenir: Türkçe karakter ve boşluk depolama anahtarında sorun çıkarır. */
    var ad=String(file.name||'dosya').replace(/[^A-Za-z0-9._-]/g,'_');
    var key=cloudTenantId+'/'+req.id+'/'+Date.now()+'_'+ad;
    return sb.storage.from(MOC_BUCKET).upload(key, file).then(function(up){
      if(up.error) throw up.error;
      return sb.from('moc_documents').insert({
        tenant_id:cloudTenantId, moc_id:req.id, doc_kind:'ATTACHMENT',
        title:file.name, storage_key:key, mime_type:file.type||null,
        size_bytes:file.size||null, uploaded_by:cloudUserId
      }).then(function(res){ if(res.error) throw res.error; });
    });
  });
  toast(t('Yükleniyor…'));
  Promise.all(isler).then(function(){
    toast(t('Dosya eklendi')); viewDetail(req.id);
  }).catch(function(e){ toast(hataMesaji(e), true); });
}
function docIndir(key){
  /* Kova public değil; imzalı geçici bağlantı üretilir (60 sn). */
  sb.storage.from(MOC_BUCKET).createSignedUrl(key, 60).then(function(r){
    if(r.error){ toast(hataMesaji(r.error), true); return; }
    window.open(r.data.signedUrl, '_blank');
  });
}
function docSil(id, key){
  confirmBox(esc(t('Bu dosya kalıcı olarak silinecek. Devam edilsin mi?')), t('Sil'), function(){
    closeModal();
    sb.storage.from(MOC_BUCKET).remove([key]).then(function(){
      return sb.from('moc_documents').delete().eq('id',id);
    }).then(function(res){
      if(res && res.error) throw res.error;
      toast(t('Dosya silindi')); viewDetail(DETAIL_CTX.req.id);
    }).catch(function(e){ toast(hataMesaji(e), true); });
  }, true);
}

/* ---- İşlem Geçmişi ----
   `moc_audit_log` trigger ile zaten doluyordu (talep, onay ve risk kayıtlarındaki her
   değişiklik) ama gösteren tek bir ekran yoktu. Denetçinin ilk sorduğu şey budur. */
var GECMIS_ALAN_ETIKET = {
  status:'Durum', title:'Başlık', description:'Açıklama', reason:'Gerekçe',
  priority:'Öncelik', planned_end:'Planlanan Bitiş', unit_area:'Ünite/Bölüm',
  decision:'Karar', step_order:'Sıra', role_code:'Rol', approver_id:'Onaylayan',
  baslangic_maliyeti:'Başlangıç Maliyeti', tamamlanma_sonrasi_maliyet:'Tamamlanma Maliyeti',
  para_birimi:'Para Birimi', closed_at:'Kapanış', deleted_at:'Gizlenme',
  category_id:'Kategori', type_id:'Akış Türü', is_rik:'RIK', risk_after:'Risk (sonra)',
  risk_before:'Risk (önce)', controls:'Önlemler', hazard:'Tehlike'
};
var GECMIS_HARIC = ['id','tenant_id','created_at','updated_at','moc_no','initiator_id','moc_id','version','updated_by','created_by'];
function renderGecmisPanel(){
  var rows=DETAIL_CTX.gecmis||[];
  var html='<div class="panel" id="gecmisPanel"><div class="ph"><h2>'+t('İşlem Geçmişi')+'</h2></div><div class="pb">';
  if(!rows.length){ html+='<div class="empty">'+t('Bu kayıt için henüz bir işlem geçmişi yok.')+'</div>'; }
  else{
    html+='<div style="display:flex;flex-direction:column;gap:8px">';
    rows.forEach(function(g){
      var farklar=gecmisFarklari(g);
      html+='<div style="border-left:3px solid var(--leaf);background:var(--mint);border-radius:6px;padding:9px 11px">'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12.5px">'
        +'<b>'+esc(gecmisIslemAdi(g.action))+'</b>'
        +'<span style="color:var(--muted)">'+esc(gecmisTabloAdi(g.table_name))+'</span>'
        +'<span style="margin-left:auto;color:var(--muted);font-size:11.5px">'+fmtDT(g.created_at)+'</span></div>';
      if(farklar.length){
        html+='<div style="margin-top:5px;display:flex;flex-direction:column;gap:2px">';
        farklar.forEach(function(d){
          html+='<div style="font-size:12px;color:var(--muted)"><span style="color:var(--fg)">'+esc(d.ad)+':</span> '
            +'<span style="text-decoration:line-through;opacity:.7">'+esc(d.eski)+'</span> → '
            +'<span style="color:var(--fg)">'+esc(d.yeni)+'</span></div>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}
function gecmisIslemAdi(a){
  return a==='INSERT'?t('Oluşturuldu'):a==='UPDATE'?t('Güncellendi'):a==='DELETE'?t('Silindi'):a;
}
function gecmisTabloAdi(tn){
  return tn==='moc_requests'?t('Talep'):tn==='moc_approvals'?t('Onay adımı'):tn==='moc_risk_assessments'?t('Risk kaydı'):tn;
}
/* Yalnız GERÇEKTEN değişen ve anlamlı alanlar gösterilir; tüm satırı iki kez basmak
   "ne değişti?" sorusunu okunmaz hâle getirir. */
function gecmisFarklari(g){
  var eski=g.old_data||{}, yeni=g.new_data||{}, out=[];
  if(g.action==='INSERT') return out;
  Object.keys(yeni).forEach(function(k){
    if(GECMIS_HARIC.indexOf(k)>=0) return;
    var a=eski[k], b=yeni[k];
    if(JSON.stringify(a)===JSON.stringify(b)) return;
    out.push({ ad:t(GECMIS_ALAN_ETIKET[k]||k), eski:gecmisDeger(k,a), yeni:gecmisDeger(k,b) });
  });
  return out;
}
function gecmisDeger(alan,v){
  if(v===null||v===undefined||v==='') return '—';
  if(typeof v==='boolean') return v?t('Evet'):t('Hayır');
  if(alan==='status') return t(STATUS_LABEL[v]||v);
  if(alan==='category_id'){ var c=catById(v); return c?c.name_tr:String(v); }
  if(alan==='type_id'){ var ty=typeById(v); return ty?ty.name_tr:String(v); }
  if(typeof v==='object') return JSON.stringify(v);
  return String(v);
}

/* ---- Geçici Değişiklik: geri dönüş ve uzatma ----
   Sektörde en bilinen kaza sebebi, geçici bir değişikliğin sessizce kalıcılaşmasıdır.

function renderTempPanel(){
  var ctx=DETAIL_CTX, req=ctx.req, typ=ctx.type;
  if(!(typ&&typ.requires_end_date)) return '';
  var tr=ctx.temp||{};
  var ce=canDo('coordinate') && ['CLOSED','REJECTED','CANCELLED'].indexOf(req.status)<0;
  var bitis=tr.expires_at||req.planned_end;
  var html='<div class="panel" id="tempPanel"><div class="ph"><h2>'+t('Geçici Değişiklik Takibi')+'</h2></div><div class="pb">';
  html+='<div class="row2"><div><b>'+t('Bitiş tarihi')+':</b> '+esc(bitis||'—')+'</div>'
      +'<div><b>'+t('Uzatma sayısı')+':</b> '+(tr.extension_count||0)+'</div></div>';
  if(tr.restored_at){
    html+='<div class="alert-chip ok" style="margin-top:10px">✓ '+t('Eski duruma dönüldü:')+' '+fmtDT(tr.restored_at)
      +(tr.restore_note?(' · '+esc(tr.restore_note)):'')+'</div>';
  } else if(bitis){
    var d=daysLeft(bitis);
    html+='<div class="alert-chip '+(d<0?'crit':d<=7?'warn':'blue')+'" style="margin-top:10px">'
      +(d<0?(t('Süresi')+' '+Math.abs(d)+' '+t('gün geçti — eski duruma dönüş veya uzatma gerekli.')):(t('Kalan')+' '+d+' '+t('gün')))+'</div>';
  }
  if((tr.extension_history||[]).length){
    html+='<div style="margin-top:10px"><b>'+t('Uzatma geçmişi')+':</b><ul style="margin:6px 0 0 18px;color:var(--muted);font-size:12.5px">';
    (tr.extension_history||[]).forEach(function(u){
      html+='<li>'+esc(u.eski||'—')+' → '+esc(u.yeni||'—')+' · '+esc(u.gerekce||'')+' ('+fmtDT(u.tarih)+')</li>';
    });
    html+='</ul></div>';
  }
  if(ce && !tr.restored_at){
    html+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
      +'<button class="btn-line sm" id="btnTempExtend">'+t('Süreyi Uzat')+'</button>'
      +'<button class="btn-leaf sm" id="btnTempRestore">'+t('Eski Duruma Dönüldü')+'</button></div>';
  }
  html+='</div></div>';
  return html;
}

/* ---- Denetim dosyası çıktısı ----
   Denetçi "şu değişikliğin dosyasını göster" dediğinde ekran görüntüsünden başka yol yoktu.
   Veri zaten detay ekranında toplandığı için yeni sorgu atılmaz; yazdırılabilir tek sayfa. */
function denetimDosyasi(){
  var ctx=DETAIL_CTX, req=ctx.req, typ=ctx.type, c=ctx.category;
  var td='padding:4px 8px;border-bottom:1px solid #eee';
  var th='text-align:left;padding:4px 8px;border-bottom:1px solid #ddd';
  var sat=function(a,b){ return '<tr><th style="'+th+';width:210px">'+esc(a)+'</th><td style="'+td+'">'+esc(b==null||b===''?'—':b)+'</td></tr>'; };
  var h='<h1 style="font-size:19px;margin:0 0 2px">'+esc(req.moc_no||('MOC #'+req.id))+' — '+esc(req.title)+'</h1>';
  h+='<div style="color:#555;font-size:12px;margin-bottom:14px">'+esc(t('Denetim dosyası'))+' · '+esc(fmtDT(new Date().toISOString()))+'</div>';

  h+='<h2 style="font-size:14px;margin:16px 0 6px">'+esc(t('Talep Bilgisi'))+'</h2><table style="width:100%;border-collapse:collapse;font-size:12.5px">';
  h+=sat(t('Durum'), t(STATUS_LABEL[req.status]||req.status));
  h+=sat(t('Kategori'), c?c.name_tr:'—');
  h+=sat(t('Akış Türü'), typ?typ.name_tr:'—');
  h+=sat(t('Öncelik'), req.priority);
  h+=sat(t('Ünite/Bölüm'), req.unit_area);
  h+=sat(t('Açıklama'), req.description);
  h+=sat(t('Gerekçe'), req.reason);
  h+=sat(t('Planlanan Bitiş'), req.planned_end);
  h+=sat(t('Kapanış'), req.closed_at?fmtDT(req.closed_at):'—');
  h+='</table>';

  if((ctx.risks||[]).length){
    h+='<h2 style="font-size:14px;margin:16px 0 6px">'+esc(t('Risk Değerlendirmesi'))+'</h2>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><th style="'+th+'">'+esc(t('Tehlike'))+'</th><th style="'+th+'">'+esc(t('Önlemler'))+'</th><th style="'+th+'">'+esc(t('Önce'))+'</th><th style="'+th+'">'+esc(t('Sonra'))+'</th></tr>';
    ctx.risks.forEach(function(r){
      h+='<tr><td style="'+td+'">'+esc(r.hazard||'—')+'</td><td style="'+td+'">'+esc(r.controls||'—')+'</td>'
        +'<td style="'+td+';text-align:center">'+esc(r.risk_before)+'</td><td style="'+td+';text-align:center">'+esc(r.risk_after)+'</td></tr>';
    });
    h+='</table>';
  }

  if((ctx.approvals||[]).length){
    h+='<h2 style="font-size:14px;margin:16px 0 6px">'+esc(t('Onay Zinciri'))+'</h2>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><th style="'+th+'">'+esc(t('Sıra'))+'</th><th style="'+th+'">'+esc(t('Rol'))+'</th><th style="'+th+'">'+esc(t('Karar'))+'</th><th style="'+th+'">'+esc(t('Tarih'))+'</th></tr>';
    ctx.approvals.forEach(function(a){
      h+='<tr><td style="'+td+';text-align:center">'+esc(a.step_order)+'</td><td style="'+td+'">'+esc(a.role_code||'—')+'</td>'
        +'<td style="'+td+'">'+esc(a.decision||t('Bekliyor'))+'</td><td style="'+td+'">'+esc(a.decided_at?fmtDT(a.decided_at):'—')+'</td></tr>';
    });
    h+='</table>';
  }

  if((ctx.actions||[]).length){
    h+='<h2 style="font-size:14px;margin:16px 0 6px">'+esc(t('Aksiyonlar'))+'</h2>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><th style="'+th+'">'+esc(t('Aksiyon'))+'</th><th style="'+th+'">'+esc(t('Sorumlu'))+'</th><th style="'+th+'">'+esc(t('Termin'))+'</th><th style="'+th+'">'+esc(t('Durum'))+'</th></tr>';
    ctx.actions.forEach(function(a){
      h+='<tr><td style="'+td+'">'+esc(a.title||a.description||'—')+'</td><td style="'+td+'">'+esc(a.owner_name||a.owner||'—')+'</td>'
        +'<td style="'+td+'">'+esc(a.due_date||'—')+'</td><td style="'+td+'">'+esc(a.status||'—')+'</td></tr>';
    });
    h+='</table>';
  }

  var gecmis=ctx.gecmis||[];
  if(gecmis.length){
    h+='<h2 style="font-size:14px;margin:16px 0 6px">'+esc(t('İşlem Geçmişi'))+'</h2><table style="width:100%;border-collapse:collapse;font-size:12px">';
    gecmis.forEach(function(g){
      var f=gecmisFarklari(g).map(function(d){ return d.ad+': '+d.eski+' → '+d.yeni; }).join('; ');
      h+='<tr><td style="'+td+';white-space:nowrap">'+esc(fmtDT(g.created_at))+'</td>'
        +'<td style="'+td+'">'+esc(gecmisIslemAdi(g.action)+' · '+gecmisTabloAdi(g.table_name))+'</td>'
        +'<td style="'+td+'">'+esc(f||'—')+'</td></tr>';
    });
    h+='</table>';
  }

  var w=window.open('', '_blank');
  if(!w){ toast(t('Yazdırma penceresi engellendi. Tarayıcı ayarlarından izin verin.'), true); return; }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(req.moc_no||('MOC '+req.id))+'</title>'
    +'<style>body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:28px;line-height:1.45}'
    +'h2{border-bottom:2px solid #111;padding-bottom:3px}@media print{@page{margin:14mm}}</style></head><body>'
    +h+'</body></html>');
  w.document.close();
  w.focus();
  setTimeout(function(){ try{ w.print(); }catch(_){} }, 400);
}

function renderRiskPanel(){
  var ctx=DETAIL_CTX;

    return '<tr><td>'+esc(r.hazard)+'</td><td>'+riskCell(r.risk_before)+'</td><td>'+riskCell(r.risk_after)+'</td><td>'+esc(r.controls||'—')+'</td></tr>';

function riskCell(score){
  if(score==null) return '—';
  var cls = score<=4?'var(--ok)':score<=9?'var(--warn)':score<=14?'#FB923C':'var(--crit)';
  return '<span class="risk-cell" style="background:'+cls+'">'+score+'</span>';
}

/* ============================================================================
   İlişkili Kayıtlar (qdl_cross_refs — ortak platform tablosu, RLS/tenant_id
   otomatik). Bir MOC talebinin başka modüllerdeki (DÖF/Q-Kalite, Tedarikçi,
   Ekipman, Gıda) kayıtlarla ilişkisini gösterir/yönetir. Cross-project lookup
   yapılamadığından hedef etiket serbest metin — bilinçli MVP kısıtı.
   Desen Q-Tedarikçi Yönetimi modülündeki crossRefs* fonksiyonlarından
   taşındı; MOC'un kendi sb/esc/val/toast/pill sınıflarına uyarlandı. */
var CROSS_REF_MODULES=[{v:'q-kalite',l:'DÖF / Q-Kalite'},{v:'tedarikci',l:'Tedarikçi Yönetimi'},{v:'ekipman',l:'Ekipman'},{v:'gida',l:'Gıda Güvenliği'}];
function crossRefModuleLabel(v){var m=CROSS_REF_MODULES.find(function(x){return x.v===v;});return m?t(m.l):(v||'—');}
function crossRefsPanelHTML(){
  return '<div class="panel" id="crPanel"><div class="ph"><h2>'+t('🔗 İlişkili Kayıtlar')+'</h2>'
    +'<button type="button" class="btn-line sm" id="crAddBtn" style="margin-left:auto">'+t('+ Bağlantı Ekle')+'</button>'
    +'</div><div class="pb">'
    +'<div id="crList" class="empty">'+t('Yükleniyor…')+'</div>'
    +'<div id="crAddForm" style="display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">'
      +'<div class="row2"><div><label>'+t('Hedef Modül')+'</label><select id="crMod">'+CROSS_REF_MODULES.map(function(m){return '<option value="'+esc(m.v)+'">'+esc(m.l)+'</option>';}).join('')+'</select></div>'
      +'<div><label>'+t('Kayıt Etiketi')+'</label><input id="crLabel" placeholder="ör. DÖF-2024-045"></div></div>'
      +'<label>'+t('Not (opsiyonel)')+'</label><input id="crNote" placeholder="kısa açıklama">'
      +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">'
        +'<button type="button" class="btn-line sm" id="crCancelBtn">'+t('Vazgeç')+'</button>'
        +'<button type="button" class="btn-leaf sm" id="crSaveBtn">'+t('Kaydet')+'</button>'
      +'</div>'
    +'</div>'
  +'</div></div>';
}
function crossRefsItemHTML(r,mySourceId){
  var mine=String(r.source_id)===String(mySourceId)&&r.source_table==='moc_requests';
  var mod=mine?r.target_module:r.source_module,lbl=mine?(r.target_label||r.target_id):(r.source_label||r.source_id);
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2)">'
    +'<div style="font-size:12.5px"><span class="pill blue">'+esc(crossRefModuleLabel(mod))+'</span> '+esc(lbl||'—')+(r.note?' <span style="color:var(--muted)"> — '+esc(r.note)+'</span>':'')+'</div>'
    +'<button type="button" class="btn-line sm" data-cr-del="'+r.id+'" title="'+t('Bağlantıyı sil')+'" style="flex-shrink:0;padding:2px 9px">✕</button>'
  +'</div>';
}
function crossRefsLoad(sourceId){
  var listEl=document.getElementById('crList'); if(!listEl) return;
  var q1=sb.from('qdl_cross_refs').select('*').eq('source_module','moc').eq('source_table','moc_requests').eq('source_id',String(sourceId));
  var q2=sb.from('qdl_cross_refs').select('*').eq('target_module','moc').eq('target_table','moc_requests').eq('target_id',String(sourceId));
  Promise.all([q1,q2]).then(function(res){
    if(res[0].error||res[1].error){ listEl.className='empty'; listEl.textContent=t('Yüklenemedi')+': '+((res[0].error||res[1].error).message); return; }
    var rows=(res[0].data||[]).concat(res[1].data||[]);
    if(!rows.length){ listEl.className='empty'; listEl.textContent=t('Henüz ilişkili kayıt yok.'); return; }
    listEl.className=''; listEl.innerHTML=rows.map(function(r){return crossRefsItemHTML(r,sourceId);}).join('');
    Array.prototype.forEach.call(listEl.querySelectorAll('[data-cr-del]'),function(b){
      b.onclick=function(){ crossRefsDelete(b.getAttribute('data-cr-del'),sourceId); };
    });
  });
}
function crossRefsDelete(refId,sourceId){
  confirmBox('Bu bağlantı silinsin mi?','Sil',function(){
    sb.from('qdl_cross_refs').delete().eq('id',refId).then(function(res){
      if(res.error){ toast(t('Silinemedi')+': '+hataMesaji(res.error),true); return; }
      closeModal(); toast(t('Bağlantı silindi')); crossRefsLoad(sourceId);
    });
  },true);
}
/* Faz 3.7 (2026-08-26) — yeni bağlantı eklenince tenant sahibine (is_owner=true) bildirim.
   Ekipman index.html'deki notifyOwnerOfCrossRef() ile birebir aynı desen. */
function notifyOwnerOfCrossRef(targetModule,sourceLabel,targetLabel){
  sb.auth.getUser().then(function(ures){
    var user=ures&&ures.data&&ures.data.user;if(!user)return;
    sb.from('profiles').select('tenant_id,is_owner').eq('id',user.id).maybeSingle().then(function(mres){
      var me=mres&&mres.data;if(!me||!me.tenant_id)return;
      sb.from('profiles').select('id').eq('tenant_id',me.tenant_id).eq('is_owner',true).maybeSingle().then(function(ores){
        var owner=ores&&ores.data;if(!owner||owner.id===user.id)return;
        sb.from('qdl_notifications').insert({
          tenant_id:me.tenant_id,recipient_user_id:owner.id,module:'moc',
          title:'Yeni ilişkili kayıt eklendi',
          body:(sourceLabel||'Bir MOC talebi')+' → '+crossRefModuleLabel(targetModule)+': '+targetLabel,
          link_module:'moc'
        });
      });
    });
  }).catch(function(){});
}
function crossRefsBind(sourceId,sourceLabel){
  crossRefsLoad(sourceId);
  var addBtn=document.getElementById('crAddBtn'), form=document.getElementById('crAddForm'),
      cancel=document.getElementById('crCancelBtn'), save=document.getElementById('crSaveBtn');
  if(addBtn) addBtn.onclick=function(){ form.style.display=form.style.display==='none'?'block':'none'; };
  if(cancel) cancel.onclick=function(){ form.style.display='none'; };
  if(save) save.onclick=function(){
    var mod=val('crMod'), lbl=(val('crLabel')||'').trim(), note=(val('crNote')||'').trim();
    if(!lbl){ toast('Kayıt etiketi zorunludur',true); return; }
    sb.from('qdl_cross_refs').insert({
      source_module:'moc', source_table:'moc_requests', source_id:String(sourceId), source_label:sourceLabel||null,
      target_module:mod, target_table:'manual', target_id:lbl, target_label:lbl,
      note:note||null
    }).then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      toast('Bağlantı eklendi');
      document.getElementById('crLabel').value=''; document.getElementById('crNote').value=''; form.style.display='none';
      crossRefsLoad(sourceId);
      notifyOwnerOfCrossRef(mod,sourceLabel,lbl);
    });
  };
}
