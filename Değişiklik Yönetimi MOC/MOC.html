   her bölüm (bolum_baslik — Gıda seti de kendi tek bölümü) katlanır bir
   blok; varsayılan olarak yalnız İLK YANITSIZ bölüm açık, tamamlanmış
   bölümler kapalı + "✓ Tamamlandı" rozetiyle gösterilir. Kullanıcı
   herhangi bir bölüm başlığına tıklayıp istediği an açıp kapatabilir —
   bu manuel tercih CHECKLIST_MANUAL_OVERRIDE'da tutulur ve o tercih,
   bölüm sonradan tamamlansa/eksik kalsa bile korunur; override
   YOKSA açık/kapalı durumu her render'da "ilk yanıtsız bölüm" kuralına
   göre otomatik yeniden hesaplanır — böylece bir bölüm tamamlanınca bir
   sonraki eksik bölüm kendiliğinden açılır (kaldığı yerden devam).
   Satırlar kapalı bölümde de DOM'da kalır (yalnız CSS ile gizlenir) ki
   focusNextChecklistItem'ın scrollIntoView'ı bozulmasın.
   ========================================================================= */
var CHECKLIST_MANUAL_OVERRIDE={}, CHECKLIST_OVERRIDE_REQ=null;
function renderChecklistPanel(){
  return renderChecklistPanelGeneric(applicableChecklistItems(DETAIL_CTX.req.category_id), 'checklistPanel', t('Etki Değerlendirme Checklist\'i'));
}
function renderPssrChecklistPanel(){
  return renderChecklistPanelGeneric(applicablePssrChecklistItems(), 'pssrChecklistPanel', t('PSSR Checklist\'i — Devreye Alma Öncesi Güvenlik İncelemesi'));
}
function renderChecklistPanelGeneric(items, panelId, heading){
  var ctx=DETAIL_CTX, req=ctx.req;
  if(!items.length) return '';
  if(CHECKLIST_OVERRIDE_REQ!==req.id){ CHECKLIST_MANUAL_OVERRIDE={}; CHECKLIST_OVERRIDE_REQ=req.id; }
  var answersByMadde={};
  (ctx.checklistAnswers||[]).forEach(function(a){ answersByMadde[a.madde_id]=a; });
  var canAnswer = canDo('risk') || canDo('coordinate');

  var sectionOrder=[], sectionsMap={};
  items.forEach(function(m){
    var key=m.bolum_baslik;
    if(!sectionsMap[key]){ sectionsMap[key]={name:key, items:[]}; sectionOrder.push(key); }
    sectionsMap[key].items.push(m);
  });
  var sections=sectionOrder.map(function(k){return sectionsMap[k];});
  sections.forEach(function(s){
    s.answered = s.items.filter(function(m){return answersByMadde[m.id]&&answersByMadde[m.id].cevap;}).length;
    s.total = s.items.length;
    s.complete = s.answered===s.total;
  });
  var firstIncompleteIdx = sections.findIndex(function(s){return !s.complete;});

  var body = sections.map(function(s,idx){
    var hasOverride = Object.prototype.hasOwnProperty.call(CHECKLIST_MANUAL_OVERRIDE, s.name);
    var open = hasOverride ? CHECKLIST_MANUAL_OVERRIDE[s.name] : (idx===firstIncompleteIdx);
    var rows = s.items.map(function(m){ return renderChecklistRow(m, answersByMadde[m.id], canAnswer); }).join('');
    var statusBadge = s.complete
      ? '<span class="pill ok">'+t('✓ Tamamlandı')+'</span>'
      : '<span class="pill '+(s.answered?'warn':'na')+'">'+s.answered+'/'+s.total+' '+t('yanıtlandı')+'</span>';
    return '<div class="chk-section'+(open?' open':'')+'">'
      +'<button type="button" class="chk-section-hd" data-section="'+esc(s.name)+'">'
        +'<span class="chk-section-chevron">'+(open?'▾':'▸')+'</span>'
        +'<span class="chk-section-name">'+esc(s.name)+'</span>'
        +statusBadge
      +'</button>'
      +'<div class="chk-section-body">'+rows+'</div>'
      +'</div>';
  }).join('');

  var answered=items.filter(function(m){return answersByMadde[m.id]&&answersByMadde[m.id].cevap;}).length;
  var html='<div class="panel" id="'+panelId+'"><div class="ph"><h2>'+heading+'</h2>'
    +'<span class="pill '+(answered===items.length?'ok':'warn')+'" style="margin-left:auto">'+answered+'/'+items.length+' '+t('yanıtlandı')+'</span></div><div class="pb">';
  html+=body;
  html+='<p class="hint">'+t('Bu aşamayı geçmeden önce tüm maddeler yanıtlanmalı, tetikleyici cevabın doğurduğu aksiyonlar kapatılmalıdır.')+'</p>';
  html+='</div></div>';
  return html;
}
/* Her maddenin kendi tetikleyen_cevap'ı (Evet/Hayır) var — "risk tespit"
   tarzı sorularda Evet, "doğrulama/teyit" tarzı sorularda Hayır kötü
   haberdir ve aksiyon/gerekçe akışını o taraf tetikler. Eski veri/kolon
   henüz uygulanmadıysa (tetikleyen_cevap undefined) varsayılan 'Evet'e
   düşer — geriye dönük uyumlu. */
function checklistTriggerCevap(m){
  return (m && m.tetikleyen_cevap==='Hayır') ? 'HAYIR' : 'EVET';
}
function renderChecklistRow(m, a, canAnswer){
  var cevap = a&&a.cevap;
  var trigger = checklistTriggerCevap(m);
  function chip(val,lbl){
    var active = cevap===val;
    return '<button type="button" class="sm chkchip'+(active?' active-'+val:'')+'" data-id="'+m.id+'" data-cevap="'+val+'"'+(canAnswer?'':' disabled')+'>'+lbl+'</button>';
  }
  var actionBadge = (a&&a.action_id) ? ' <span class="pill warn">'+t('Aksiyon açık')+'</span>' : '';
  var showGerekce = cevap===trigger;
  var gerekceBox = '<div class="chk-gerekce" data-gid="'+m.id+'" style="'+(showGerekce?'':'display:none')+'">'
    +'<textarea class="chkGerekceInput" data-id="'+m.id+'" placeholder="'+t('Gerekçe (zorunlu)')+'">'+(a?esc(a.gerekce||''):'')+'</textarea>'
    +(canAnswer?'<button type="button" class="sm btn-leaf chkGerekceSave" data-id="'+m.id+'">'+t('Kaydet')+'</button>':'')
    +'</div>';
  var noteLink = (canAnswer && cevap && cevap!==trigger)
    ? '<div class="hint"><a href="#" class="chkNoteLink" data-id="'+m.id+'">'+(a&&a.gerekce?t('Notu düzenle'):t('+ Not ekle'))+'</a></div>' : '';
  return '<div class="chk-row" data-row-id="'+m.id+'">'
    +'<div class="chk-q">'+esc(m.soru_metni)+actionBadge+'</div>'
    +'<div class="chk-chips">'+chip('HAYIR',t('Hayır'))+chip('EVET',t('Evet'))+chip('NA','N/A')+'</div>'
    +gerekceBox+noteLink
    +'</div>';
}
function bindChecklistEvents(){
  Array.prototype.forEach.call(document.querySelectorAll('.chkchip'),function(b){
    if(b.disabled) return;
    b.onclick=function(){
      var id=Number(b.getAttribute('data-id')), cevap=b.getAttribute('data-cevap');
      var m=(CHECKLIST_ITEMS||[]).find(function(x){return x.id===id;});
      if(!m) return;
      if(cevap===checklistTriggerCevap(m)){ toggleChecklistGerekce(id,true); return; }
      toggleChecklistGerekce(id,false);
      commitChecklistAnswer(m, cevap, '');
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chkGerekceSave'),function(b){
    b.onclick=function(){
      var id=Number(b.getAttribute('data-id'));
      var m=(CHECKLIST_ITEMS||[]).find(function(x){return x.id===id;});
      if(!m) return;
      var ta=document.querySelector('.chkGerekceInput[data-id="'+id+'"]');
      var gerekce=ta?ta.value:'';
      if(!gerekce.trim()){ toast('Bu cevap için gerekçe zorunlu.',true); return; }
      commitChecklistAnswer(m,checklistTriggerCevap(m),gerekce);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chkNoteLink'),function(lnk){
    lnk.onclick=function(e){ e.preventDefault(); toggleChecklistGerekce(Number(lnk.getAttribute('data-id')),true); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chk-section-hd'),function(b){
    b.onclick=function(){ toggleChecklistSection(b.getAttribute('data-section')); };
  });
}
function toggleChecklistSection(name){
  var wrap=document.querySelector('.chk-section-hd[data-section="'+cssEsc(name)+'"]');
  var open = wrap && wrap.parentElement.classList.contains('open');
  CHECKLIST_MANUAL_OVERRIDE[name] = !open;
  replacePanelById('checklistPanel', renderChecklistPanel());
  bindChecklistEvents();
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }
function toggleChecklistGerekce(id, show){
  var el=document.querySelector('.chk-gerekce[data-gid="'+id+'"]');
  if(!el) return;
  el.style.display = show?'':'none';
  if(show){ var ta=el.querySelector('textarea'); if(ta) ta.focus(); }
}
function checklistPhaseForMadde(m){
  var s=(CHECKLIST_SETS||[]).find(function(x){return x.id===m.set_id;});
  return (s && s.tetik_tipi==='durum') ? s.tetik_durum_kodu : 'PRE_APPROVAL';
}
function commitChecklistAnswer(m, cevap, gerekce){
  var existing=(DETAIL_CTX.checklistAnswers||[]).find(function(a){return a.madde_id===m.id;});
  var needsAction = cevap===checklistTriggerCevap(m) && m.evet_aksiyon_gerekli;
  var actionPromise = Promise.resolve(existing?existing.action_id:null);
  if(needsAction && !(existing&&existing.action_id)){
    actionPromise = sb.from('moc_action_items').insert({
      tenant_id:cloudTenantId, moc_id:DETAIL_CTX.req.id, title:'Etki değerlendirme: '+m.soru_metni,
      phase:checklistPhaseForMadde(m), assignee_id:cloudUserId
    }).select().single().then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return existing?existing.action_id:null; }
      return res.data.id;
    });
  } else if(!needsAction && existing && existing.action_id){
    // Cevap daha önce tetikleyiciydi (aksiyon açılmıştı), şimdi tetikleyici olmayan bir
    // cevaba çevrildi — açılan aksiyon iptal edilmezse sonsuza kadar "açık" kalıp
    // condActionsDone() kontrollerini gereksiz yere kilitli tutardı (yetim aksiyon).
    actionPromise = sb.from('moc_action_items').update({status:'CANCELLED'}).eq('id',existing.action_id).then(function(){ return null; });
  }
  actionPromise.then(function(actionId){
    var payload={ tenant_id:cloudTenantId, moc_request_id:DETAIL_CTX.req.id, madde_id:m.id,
      cevap:cevap, gerekce:gerekce||null, action_id: needsAction?actionId:null,
      answered_by:cloudUserId, answered_at:new Date().toISOString() };
    var op = existing
      ? sb.from('moc_etki_checklist_yanitlari').update(payload).eq('id',existing.id).select().single()
      : sb.from('moc_etki_checklist_yanitlari').insert(payload).select().single();
    op.then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      var saved=res.data||payload;
      if(existing){
        DETAIL_CTX.checklistAnswers = DETAIL_CTX.checklistAnswers.map(function(x){ return x.id===existing.id?saved:x; });
      } else {
        DETAIL_CTX.checklistAnswers = (DETAIL_CTX.checklistAnswers||[]).concat([saved]);
      }
      refreshChecklistAndTransitions();
      focusNextChecklistItem(m.id);
    });
  });
}
function refreshChecklistAndTransitions(){
  replacePanelById('checklistPanel', renderChecklistPanel());
  replacePanelById('pssrChecklistPanel', renderPssrChecklistPanel());
  replacePanelById('transitionsPanel', renderTransitionsPanel());
  bindChecklistEvents();
  bindTransitionButtons();
}
function replacePanelById(id, html){
  var old=document.getElementById(id);
  if(!old || !html) return;
  var wrapper=document.createElement('div');
  wrapper.innerHTML=html;
  var node=wrapper.firstElementChild;
  if(node) old.parentNode.replaceChild(node, old);
}
/* DÜZELTME (2026-09-05): "→ İptal" düğmesi "→ Ön Tarama"nın hemen yanındaydı ve hiçbir onay
   sormuyordu. Yanlış tıklama talebi terminal duruma sokuyor; kayıt bir daha düzenlenemiyor,
   yeniden açılamıyor — yalnız silinebiliyordu. (Silme için onay kutusu VARDI; koruma daha
   yıkıcı olan işlemde eksikti.) Geri dönüşü olmayan üç geçiş artık onay ister. */
var GERI_DONUSSUZ = { CANCELLED:'Bu talep iptal edilecek. İptal edilen bir talep yeniden açılamaz ve düzenlenemez. Devam edilsin mi?',
                      REJECTED:'Bu talep reddedilecek. Reddedilen bir talep yeniden açılamaz. Devam edilsin mi?',
                      CLOSED:'Bu talep kapatılacak. Kapatılan bir talep yeniden açılamaz. Devam edilsin mi?' };
function bindTransitionButtons(){
  Array.prototype.forEach.call(document.querySelectorAll('.transbtn'),function(b){
    b.onclick=function(){
      var to=b.getAttribute('data-to');
      var uyari=GERI_DONUSSUZ[to];
      if(uyari){ confirmBox(esc(t(uyari)), t('Evet, devam et'), function(){ closeModal(); doTransition(to); }, true); return; }
      doTransition(to);
    };
  });
}
function focusNextChecklistItem(afterId){
  var lists=[applicableChecklistItems(DETAIL_CTX.req.category_id), applicablePssrChecklistItems()];
  var answered={};
  (DETAIL_CTX.checklistAnswers||[]).forEach(function(a){ if(a.cevap) answered[a.madde_id]=true; });
  for(var li=0; li<lists.length; li++){
    var items=lists[li];
    var idx=items.findIndex(function(m){return m.id===afterId;});
    if(idx<0) continue;
    for(var i=idx+1;i<items.length;i++){
      if(!answered[items[i].id]){
        var row=document.querySelector('.chk-row[data-row-id="'+items[i].id+'"]');
        if(row) row.scrollIntoView({block:'center',behavior:'smooth'});
        return;
      }
    }
    return;
  }
}

/* Sıralı onay zinciri: step_order'a göre sıralanmış listede, ilk kararı
   verilmemiş (decision NULL) satır "aktif" adımdır — ondan önceki tüm
   adımlar APPROVED olmadıkça bir sonraki adım görünmez/kararlaştırılamaz.
   Zincirde bir REJECTED/RETURNED varsa (checkApprovalAuto zaten MOC'u
   APPROVAL dışına çıkarır) burada aktif adım yoktur (null döner). */
function activeApprovalStep(approvals){
  var list=(approvals||[]).slice().sort(function(a,b){return a.step_order-b.step_order;});
  for(var i=0;i<list.length;i++){
    if(!list[i].decision) return list[i];
    if(list[i].decision!=='APPROVED') return null;
  }
  return null;
}
function renderApprovalsPanel(){
  var ctx=DETAIL_CTX, req=ctx.req;
  var active=activeApprovalStep(ctx.approvals);
  var html='<div class="panel"><div class="ph"><h2>'+t('Onay Zinciri')+'</h2>';
  /* APPROVAL da dahil: onay adımsız kilitlenmiş eski kayıtların kurtarma yolu (bkz. condReadyForApproval). */
  if(canDo('coordinate') && (req.status==='TECHNICAL_REVIEW' || req.status==='APPROVAL')) html+='<button class="btn-line sm" id="btnAddApproval" style="margin-left:auto">'+t('+ Onay Adımı Ekle')+'</button>';
  html+='</div><div class="pb">';
  if(!ctx.approvals.length){ html+='<div class="empty">'+t('Onay adımı tanımlanmadı.')+'</div>'; }
  else{
    html+='<p class="hint" style="margin-bottom:10px">'+t('Onay zinciri sıralıdır — bir adım, kendinden önceki tüm adımlar onaylanmadan kararlaştırılamaz.')+'</p>';
    html+=ctx.approvals.slice().sort(function(a,b){return a.step_order-b.step_order;}).map(function(a){
      var can = canDecideApproval(a);
      var decLbl;
      if(a.decision){
        decLbl = '<span class="pill '+(a.decision==='APPROVED'?'ok':a.decision==='REJECTED'?'crit':'warn')+'">'+a.decision+'</span> · '+fmtDT(a.decided_at);
      } else if(active && active.id===a.id){
        decLbl = '<span class="pill warn">'+t('Bekliyor (sıradaki adım)')+'</span>';
      } else {
        decLbl = '<span class="pill miss">'+t('Kilitli — önceki adım(lar) tamamlanmadı')+'</span>';
      }
      var actions='';
      if(can){
        actions='<button class="sm btn-leaf apdec" data-id="'+a.id+'" data-dec="APPROVED">'+t('Onayla')+'</button>'
          +'<button class="sm btn-line apdec" data-id="'+a.id+'" data-dec="RETURNED">'+t('İade')+'</button>'
          +'<button class="sm btn-crit apdec" data-id="'+a.id+'" data-dec="REJECTED">'+t('Reddet')+'</button>';
      }
      return '<div class="approval-row"><div class="step-badge'+(a.decision==='APPROVED'?' done':'')+'">'+a.step_order+'</div>'
        +'<div style="flex:1"><b>'+esc(a.role_code)+'</b><div class="hint">'+decLbl+'</div></div>'
        +'<div style="display:flex;gap:6px">'+actions+'</div></div>';
    }).join('');
  }
  html+='</div></div>';
  return html;
}
function canDecideApproval(a){
  var ctx=DETAIL_CTX, req=ctx.req;
  if(a.decision) return false;
  if(!canDo('approve') && cloudRole==='VIEWER') return false; // taban izin onay veremez
  if(req.initiator_id===cloudUserId) return false; // çıkar çatışması
  if(a.approver_id && a.approver_id!==cloudUserId) return false; // atanmışsa yalnız o kişi
  var active=activeApprovalStep(ctx.approvals);
  if(!active || active.id!==a.id) return false; // sıralı zincir: yalnız aktif (sıradaki) adım kararlaştırılabilir
  return true;
}

function renderActionsPanel(){
  var ctx=DETAIL_CTX;
  var rows=ctx.actions.map(function(a){
    return '<tr><td>'+esc(a.title)+'</td><td>'+esc(a.phase)+'</td><td>'+esc(a.due_date||'—')+'</td>'
      +'<td>'+actionStatusPill(a.status)+'</td>'
      +'<td>'+(canManageAction(a)&&a.status!=='DONE'?'<button class="sm btn-line actdone" data-id="'+a.id+'">'+t('Tamamla')+'</button>':'')+'</td></tr>';
  }).join('');
  var html='<div class="panel"><div class="ph"><h2>'+t('Aksiyonlar')+'</h2>';
  if(canDo('coordinate')) html+='<button class="btn-line sm" id="btnAddAction" style="margin-left:auto">'+t('+ Aksiyon Ekle')+'</button>';
  html+='</div><div class="pb">';
  html+= rows ? '<table><thead><tr><th>'+t('Başlık')+'</th><th>'+t('Faz')+'</th><th>'+t('Termin')+'</th><th>'+t('Durum')+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>' : '<div class="empty">'+t('Aksiyon yok.')+'</div>';
  html+='</div></div>';
  return html;
}
function canManageAction(a){ return canDo('coordinate') || a.assignee_id===cloudUserId; }
function actionStatusPill(s){ var m={OPEN:'na',IN_PROGRESS:'blue',DONE:'ok',OVERDUE:'crit',CANCELLED:'miss'}; return '<span class="pill '+(m[s]||'na')+'">'+s+'</span>'; }

function renderPssrPanel(){
  var ctx=DETAIL_CTX, p=ctx.pssr;
  var html='<div class="panel"><div class="ph"><h2>'+t('PSSR — Devreye Alma Öncesi Güvenlik İncelemesi')+'</h2></div><div class="pb">';
  html+=renderPssrChecklistPanel();
  if(!p){
    html+='<div class="empty">'+t('Checklist henüz oluşturulmadı.')+'</div>';
    if(canDo('pssr') && ctx.req.status==='PSSR') html+='<button class="btn-line" id="btnCreatePssr" style="margin-top:10px">'+t('Checklist Oluştur')+'</button>';
  } else {
    html+='<div class="row2"><div><b>'+t('Sonuç')+':</b> '+(p.result?('<span class="pill '+(p.result==='RELEASED'?'ok':p.result==='CONDITIONAL'?'warn':'crit')+'">'+p.result+'</span>'):'—')+'</div>'
      +'<div><b>'+t('Yapan')+':</b> '+fmtDT(p.performed_at)+'</div></div>';
    if(canDo('pssr') && !p.result){
      html+='<div style="display:flex;gap:8px;margin-top:12px">'
        +'<button class="btn-leaf pssrres" data-r="RELEASED">'+t('Serbest Bırak (RELEASED)')+'</button>'
        +'<button class="btn-crit pssrres" data-r="NOT_RELEASED">'+t('Serbest Bırakma (NOT_RELEASED)')+'</button></div>';
    }
  }
  html+='</div></div>';
  return html;
}

/* ---- Durum geçişi ---- */
function doTransition(to){
  var req=DETAIL_CTX.req;
  var opt=(TRANSITIONS[req.status]||[]).find(function(t){return t.to===to;});
  if(!opt || !canDo(opt.action)){ toast('Bu geçiş için yetkiniz yok.',true); return; }
  if(opt.cond && !opt.cond(req,DETAIL_CTX)){ toast('Geçiş koşulu sağlanmadı.',true); return; }
  var patch={status:to};
  if(to==='REJECTED'){
    var reason=val('rejectReason');
    if(!reason.trim()){ toast('Red gerekçesi zorunlu.',true); return; }
    patch.reason=reason;
  }
  if(to==='CLOSED') patch.closed_at=new Date().toISOString();
  var pre = (to==='APPROVAL' && req.status==='TECHNICAL_REVIEW') ? ensureRiskThresholdApproval() : Promise.resolve();
  pre.then(function(){
    sb.from('moc_requests').update(patch).eq('id',req.id).then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      /* Geçişin kendisinden SONRA çalışması gereken temizlik (bkz. resetPssrResult).
         Hata verirse kullanıcıya bildirilir ama durum geçişi geri alınmaz — geçiş zaten
         yazıldı; burada sessiz kalmak, PSSR kilidinin geri gelmesi demek olurdu. */
      var son = opt.after ? opt.after() : Promise.resolve();
      son.catch(function(e){ toast(hataMesaji(e),true); }).then(function(){
        toast(t('Durum güncellendi')+': '+t(STATUS_LABEL[to]));
        viewDetail(req.id);
      });
    });
  });
}
/* Risk eşiğine göre otomatik ek onay adımı (bkz. Ayarlar > Akış Türleri).
   moc_types.extra_approval_risk_threshold/role_code aşılırsa ve o role_code
   için henüz bir onay adımı yoksa, sona bir tane eklenir. */
function ensureRiskThresholdApproval(){
  var ctx=DETAIL_CTX, t=ctx.type;
  if(!t || !t.extra_approval_risk_threshold || !t.extra_approval_role_code) return Promise.resolve();
  var maxRisk = (ctx.risks||[]).reduce(function(m,r){ return Math.max(m, r.risk_after||0); }, 0);
  if(maxRisk < t.extra_approval_risk_threshold) return Promise.resolve();
  var already = (ctx.approvals||[]).some(function(a){ return a.role_code===t.extra_approval_role_code; });
  if(already) return Promise.resolve();
  var nextStep=(ctx.approvals||[]).length+1;
  return sb.from('moc_approvals').insert({tenant_id:cloudTenantId, moc_id:ctx.req.id, step_order:nextStep, role_code:t.extra_approval_role_code}).then(function(res){
    if(!res.error) toast('Risk eşiği aşıldı — otomatik ek onay adımı eklendi: '+t.extra_approval_role_code);
  });
}

function decideApproval(id, decision){
  confirmBox('Bu onay adımı için karar: <b>'+decision+'</b>. Onaylıyor musunuz?','Onayla',function(){
    var hash=btoa(unescape(encodeURIComponent(DETAIL_CTX.req.id+'|'+id+'|'+cloudUserId+'|'+Date.now())));
    sb.from('moc_approvals').update({decision:decision, decided_at:new Date().toISOString(), approver_id:cloudUserId, evidence_hash:hash}).eq('id',id).then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      closeModal(); toast(t('Karar kaydedildi')); checkApprovalAuto();
    });
  }, decision==='REJECTED');
}
function checkApprovalAuto(){
  var req=DETAIL_CTX.req;
  sb.from('moc_approvals').select('*').eq('moc_id',req.id).then(function(res){
    var rows=res.data||[];
    var next=null;
    var returned=rows.filter(function(a){return a.decision==='RETURNED';});
    if(rows.some(function(a){return a.decision==='REJECTED';})) next='REJECTED';
    else if(returned.length) next='TECHNICAL_REVIEW';
    else if(rows.length && rows.every(function(a){return a.decision==='APPROVED';})) next='IMPLEMENTATION';
    if(next==='TECHNICAL_REVIEW'){
      // İade edilen adımın kararı sıfırlanmazsa activeApprovalStep() bu satırda kalıcı olarak
      // takılıp kalır (decision hep 'RETURNED'!=='APPROVED' kaldığı için) — talep tekrar
      // APPROVAL'a geçse bile hiçbir adım bir daha "aktif" olamaz, onay zinciri sonsuza kadar
      // kilitlenir. İade edilen adım tekrar Bekliyor durumuna dönsün diye kararı sıfırlanır.
      var resets=returned.map(function(a){ return sb.from('moc_approvals').update({decision:null, decided_at:null, approver_id:null}).eq('id',a.id); });
      Promise.all(resets).then(function(){
        if(req.status==='APPROVAL'){ sb.from('moc_requests').update({status:next}).eq('id',req.id).then(function(){ viewDetail(req.id); }); }
        else viewDetail(req.id);
      });
    } else if(next && req.status==='APPROVAL'){
      sb.from('moc_requests').update({status:next}).eq('id',req.id).then(function(){ viewDetail(req.id); });
    } else viewDetail(req.id);
  });
}

/* ---- PSSR ---- */
var pssrOlusturuluyor=false;
function createPssr(){
  /* Çift tıklama koruması: eskiden düğme korumasızdı, iki tık iki checklist açıyor ve
     paneli kalıcı olarak işlevsizleştiriyordu (KALICI KİLİT 3). Kesin engel veritabanındaki
     UNIQUE(moc_id) kısıtı (moc_schema_faz_h), buradaki bayrak yalnız ilk savunma. */
  if(pssrOlusturuluyor || (DETAIL_CTX.pssr && DETAIL_CTX.pssr.id)) return;
  pssrOlusturuluyor=true;
  var btn=document.getElementById('btnCreatePssr'); if(btn) btn.disabled=true;
  sb.from('moc_pssr_checklists').insert({tenant_id:cloudTenantId, moc_id:DETAIL_CTX.req.id, is_template:false, name:'PSSR — '+DETAIL_CTX.req.title, items:[]}).then(function(res){
    pssrOlusturuluyor=false;
    if(res.error){ if(btn) btn.disabled=false; toast(hataMesaji(res.error),true); return; }
    toast(t('Checklist oluşturuldu')); viewDetail(DETAIL_CTX.req.id);
  });
}
/* DÜZELTME (2026-09-05) — KALICI KİLİT 2: PSSR "serbest bırakılmadı" sonucu verilip kayıt
   IMPLEMENTATION'a döndüğünde `result` alanı 'NOT_RELEASED' olarak KALIYORDU. Karar düğmeleri
   yalnız `!p.result` iken çizildiği için, eksikler giderilip tekrar PSSR'a gelindiğinde düğmeler
   bir daha görünmüyor, PSSR→STARTUP koşulu ('RELEASED') asla sağlanamıyor ve talep PSSR'da
   kalıcı olarak kilitleniyordu. Durum makinesi dosyası bu döngüyü (PSSR→IMPLEMENTATION→…→PSSR)
   açıkça öngörüyor; kod tek seferlik varsaymış. Artık geri dönüşte sonuç sıfırlanır. */
function resetPssrResult(){
  var p = DETAIL_CTX && DETAIL_CTX.pssr;
  if(!p || !p.id) return Promise.resolve();
  return sb.from('moc_pssr_checklists')
    .update({result:null, performed_by:null, performed_at:null}).eq('id',p.id)
    .then(function(res){ if(res.error) throw res.error; });
}
function setPssrResult(result){
  sb.from('moc_pssr_checklists').update({result:result, performed_by:cloudUserId, performed_at:new Date().toISOString()}).eq('id',DETAIL_CTX.pssr.id).then(function(res){
    if(res.error){ toast(hataMesaji(res.error),true); return; }
    toast(t('PSSR sonucu kaydedildi')); viewDetail(DETAIL_CTX.req.id);
  });
}

function fillRequestForm(req){
  if(req){
    document.getElementById('fTitle').value=req.title||'';
    document.getElementById('fDesc').value=req.description||'';
    document.getElementById('fCat').value=req.category_id||'';
    document.getElementById('fType').value=req.type_id||'';
    document.getElementById('fUnit').value=req.unit_area||'';
    document.getElementById('fPrio').value=req.priority||'NORMAL';
    document.getElementById('fEnd').value=req.planned_end||'';
    document.getElementById('fRik').checked=!!req.is_rik;
    document.getElementById('fReason').value=req.reason||'';
    document.getElementById('fCurrency').value=req.para_birimi||'TRY';
    document.getElementById('fCostStart').value=req.baslangic_maliyeti!=null?req.baslangic_maliyeti:'';
  }
  toggleEndDate();
  document.getElementById('fType').onchange=toggleEndDate;
}
function toggleEndDate(){
  var t=typeById(Number(val('fType')));
  document.getElementById('fEndDateWrap').style.display = (t&&t.requires_end_date)?'':'none';
}
function readRequestForm(){
  var t=typeById(Number(val('fType')));
  var title=val('fTitle');
  if(!title.trim()){ toast('Başlık zorunlu.',true); return null; }
  if(t&&t.requires_end_date&&!val('fEnd')){ toast('Bu akış türünde planlanan bitiş tarihi zorunlu.',true); return null; }
  return {
    title:title, description:val('fDesc'), category_id:Number(val('fCat')), type_id:Number(val('fType')),
    unit_area:val('fUnit'), priority:val('fPrio'), planned_end: val('fEnd')||null,
    is_rik: document.getElementById('fRik').checked, reason: val('fReason'),
    para_birimi: val('fCurrency')||'TRY', baslangic_maliyeti: num('fCostStart')
  };
}

  modalTitle('Yeni Değişiklik Talebi');
  setModalBody(requestFormHtml());
  fillRequestForm(null);
  modalFoot('Oluştur (Taslak)','Vazgeç',function(){
    var payload=readRequestForm();
    if(!payload) return;
    payload.tenant_id=cloudTenantId; payload.initiator_id=cloudUserId; payload.status='DRAFT';
    sb.from('moc_requests').insert(payload).select().single().then(function(res){
      if(res.error){ toast(hataMesaji(res.error),true); return; }
      var req=res.data;
      var typ=typeById(req.type_id);
      var after=Promise.resolve();

        after=sb.from('moc_temporary_tracking').insert({tenant_id:cloudTenantId, moc_id:req.id, expires_at:req.planned_end});
      }
      Promise.resolve(after).then(function(){
        closeModal(); toast(t('Talep oluşturuldu')); go('detail', req.id);

  openModal();

function bindSettingsEvents(){

  Array.prototype.forEach.call(document.querySelectorAll('.togglecat'),function(b){
    b.onclick=function(){

      sb.from('moc_types').update({is_active: b.getAttribute('data-v')==='true'}).eq('id',Number(b.getAttribute('data-id'))).then(function(res){
        if(res.error){ toast(hataMesaji(res.error),true); return; }
        toast(t('Güncellendi')); viewSettings();

  var acs=document.getElementById('btnAddChkSet'); if(acs) acs.onclick=openNewChecklistSetModal;

    b.onclick=function(){ cloneChecklistSet(Number(b.getAttribute('data-id'))); };

/* ---- Checklist seti kopyalama ("Kullan" / "Kopyala ve Özelleştir") ---- */
function cloneChecklistSet(setId){
  var s=(ALL_CHECKLIST_SETS||[]).find(function(x){return x.id===setId;});
  if(!s) return;
  sb.from('moc_etki_checklist_setleri').insert({tenant_id:cloudTenantId, kategori_id:s.kategori_id, ad:s.ad, aciklama:s.aciklama, aktif:true}).select().single().then(function(res){
    if(res.error){ toast(hataMesaji(res.error),true); return; }
    var newSetId=res.data.id;
    var items=(ALL_CHECKLIST_ITEMS||[]).filter(function(m){return m.set_id===setId;});
    if(!items.length){ toast(t('Set kopyalandı')); viewSettings(); return; }
    var payload=items.map(function(m){
      return {set_id:newSetId, bolum_baslik:m.bolum_baslik, soru_metni:m.soru_metni, sira_no:m.sira_no, evet_aksiyon_gerekli:m.evet_aksiyon_gerekli, tetikleyen_cevap:m.tetikleyen_cevap||'Evet'};
    });
    sb.from('moc_etki_checklist_maddeleri').insert(payload).then(function(res2){
      if(res2.error){ toast(hataMesaji(res2.error),true); return; }
      toast(t('Set tesisinize kopyalandı')); viewSettings();
    });
  });
}

/* ============================================================================
   Modal / util (Ekipman/Gıda desenine uyumlu)
   ========================================================================= */
function modalTitle(ttl){ document.getElementById('modalTitle').textContent=t(ttl); }
function setModalBody(h){ document.getElementById('modalBody').innerHTML=h; }
function modalFoot(saveLbl,cancelLbl,onSave){
  var sv=document.getElementById('modalSave'), cn=document.getElementById('modalCancel');
  sv.className='btn-leaf';
  /* DÜZELTME (2026-09-05): Kaydet tıklandıktan sonra devre dışı bırakılmıyordu; yavaş
     bağlantıda iki tık iki ayrı kayıt (iki ayrı MOC numarası, iki aksiyon, iki onay adımı)
     üretiyordu. Düğme artık ilk tıklamada kilitlenir; işlem hata verirse çağıran taraf
     modalı açık bıraktığında düğme yeniden açılsın diye kısa bir süre sonra serbest kalır. */
  if(saveLbl){
    sv.style.display=''; sv.textContent=t(saveLbl); sv.disabled=false;
    sv.onclick = onSave ? function(ev){
      if(sv.disabled) return;
      sv.disabled=true;
      try{ onSave(ev); } finally { setTimeout(function(){ sv.disabled=false; }, 2500); }
    } : null;
  } else sv.style.display='none';
  cn.textContent=t(cancelLbl||'Kapat');
}
function openModal(wide){ document.getElementById('modalBox').className='modal'+(wide?' wide':''); document.getElementById('overlay').classList.add('on'); document.getElementById('modalWrap').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); document.getElementById('modalWrap').classList.remove('on'); }
function confirmBox(msg,okLbl,onOk,danger){
  modalTitle('Onay');
  setModalBody('<div style="font-size:13.5px;line-height:1.55">'+msg+'</div>');
  var sv=document.getElementById('modalSave'), cn=document.getElementById('modalCancel');
  sv.style.display=''; sv.textContent=t(okLbl||'Onayla'); sv.disabled=false; sv.className=danger?'btn-crit':'btn-leaf'; sv.onclick=function(){ onOk&&onOk(); };
  cn.textContent=t('Vazgeç');
  openModal();
}
var toastT=null;
function toast(msg,err){ var tEl=document.getElementById('toast'); tEl.textContent=msg; tEl.className='toast on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(function(){tEl.className='toast';},2800); }
/* ── Merkezî hata mesajı çevirici (2026-09-05) ──
   NEDEN: 32 noktada ham veritabanı hatası doğrudan ekrana basılıyordu; kullanıcı
   `duplicate key value violates unique constraint "moc_approvals_moc_id_step_order_role_code_key"`
   gibi bir metin görüyor, tablo/kolon/kısıt adları sızıyordu. Bu hem platformun
   "kullanıcı mesajlarında iç detay görünmez" kuralının ihlali hem de şema keşfine
   yardım ettiği için güvenlik açısından istenmeyen bir durumdu. Ham metin artık
   YALNIZ konsola gider. */
function hataMesaji(err){
  try{ console.error('[qdl/moc]', err); }catch(_){}
  var kod=(err&&err.code)||'';
  var msj=String((err&&err.message)||'');

  if(kod==='23505'){
    if(msj.indexOf('step_order')>=0) return t('Bu sıra ve rol için zaten bir onay adımı tanımlı.');
    if(msj.indexOf('moc_no')>=0)     return t('Bu talep numarası zaten kullanılıyor. Lütfen tekrar deneyin.');
    if(msj.indexOf('pssr')>=0)       return t('Bu talep için zaten bir güvenlik incelemesi checklist’i var.');
    if(msj.indexOf('madde')>=0)      return t('Bu madde için zaten bir cevap kayıtlı.');
    return t('Bu kayıt zaten mevcut. Lütfen bilgileri kontrol edin.');
  }
  if(kod==='23503') return t('Bu kayıt başka bir kayda bağlı olduğu için işlem yapılamadı.');
  if(kod==='23514') return t('Girilen değerlerden biri geçerli değil. Lütfen kontrol edin.');
  if(kod==='23502') return t('Zorunlu alanlardan biri boş bırakılmış.');
  if(kod==='42501' || kod==='PGRST301') return t('Bu işlem için yetkiniz yok.');
  if(kod==='PGRST303') return t('Oturumunuzun süresi doldu. Lütfen tekrar giriş yapın.');
  if(kod==='PGRST116') return t('Beklenenden fazla kayıt bulundu. Lütfen sayfayı yenileyin.');

  if(/row-level security|violates row-level/i.test(msj)) return t('Bu işlem için yetkiniz yok.');
  if(/JWT|token is expired/i.test(msj)) return t('Oturumunuzun süresi doldu. Lütfen tekrar giriş yapın.');
  if(/Failed to fetch|NetworkError/i.test(msj)) return t('Bağlantı kurulamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.');

  /* Sunucu tarafı iş kuralı sinyalleri (bkz. moc_schema_faz_h_kurallar.sql) */
  if(msj.indexOf('MOC_YETKI_YOK')>=0)       return t('Bu işlem için yetkiniz yok.');
  if(msj.indexOf('MOC_KENDI_ONAYI')>=0)     return t('Kendi açtığınız talebi onaylayamazsınız.');
  if(msj.indexOf('MOC_MUKERRER_ONAY')>=0)   return t('Bu zincirde daha önce karar verdiniz; ikinci bir adımı siz onaylayamazsınız.');
  if(msj.indexOf('MOC_GECERSIZ_GECIS')>=0)  return t('Bu durum geçişi yapılamaz.');

  return t('İşlem tamamlanamadı. Lütfen tekrar deneyin.');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function num(id){ var v=val(id); return v===''?null:Number(v); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function fmtDT(iso){ if(!iso) return '—'; var d=new Date(iso); return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }

// Koyu (varsayılan) / açık tema seçimi. Marka moru (--leaf) sabit kalır, yalnız
// zemin/metin ters çevrilir; seçim localStorage'da kalıcıdır (bkz. head'deki
// FOUC-önleme betiği, html[data-theme="light"] bloğu).
function initThemeToggle(){
  var btn=document.getElementById('btnThemeToggle');
  if(!btn) return;
  function current(){ try{ return localStorage.getItem('moc_theme')==='light'?'light':'dark'; }catch(e){ return 'dark'; } }
  function paint(t){ btn.textContent = t==='light' ? '☀' : '🌙'; }
  paint(current());
  btn.onclick=function(){
    var next = current()==='light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next==='light'?'light':'dark');
    try{ localStorage.setItem('moc_theme', next); }catch(e){}
    paint(next);
  };
}
